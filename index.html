const quiet=fn=>{const T=toast,B=burstAt,X=sfx;toast=()=>{};burstAt=()=>{};sfx=()=>{};try{fn()}finally{toast=T;burstAt=B;sfx=X}};
function immoBuyPlan(){const free=propsList().filter(o=>!S.props[o.pid]).sort((a,b)=>propBase(a)-propBase(b)),list=[];let n=ownedCount(),tot=0;
  for(const o of free){const p=Math.round(propBase(o)*Math.pow(1.1,n)*immoIdx());if(tot+p>S.cash)break;list.push(o);tot+=p;n++}return{list,tot}}
function immoBuyAll(){const P=immoBuyPlan();if(!P.list.length){toast('Rien d’abordable pour l’instant.');sfx('no');return}
  const c0=S.cash;let k=0;P.list.forEach(o=>{const p=propPrice(o);if(!S.props[o.pid]&&S.cash>=p){spend(p);S.props[o.pid]=1;S.counts.propsBought++;k++}});
  immoSync();computeNb();addXP(10*k);sfx('rank');checkTrophies();immoLog(`Achat groupé : ${k} bien${k>1?'s':''} pour ${fmt(c0-S.cash)}.`);toast(`${k} bien${k>1?'s':''} achetés pour ${fmt(c0-S.cash)}.`)}
function immoUpPlan(only){const lv={},steps=[];let tot=0;const own=propsList().filter(o=>S.props[o.pid]&&(!only||o.pid===only));own.forEach(o=>lv[o.pid]=S.props[o.pid]);
  for(let it=0;it<300;it++){let best=null,bc=Infinity;own.forEach(o=>{const l=lv[o.pid];if(l>=4)return;const c=l<3?renovCost(o,l):rebuildCost(o);if(c<bc){bc=c;best=o}});
    if(!best||tot+bc>S.cash)break;tot+=bc;steps.push(best.pid);lv[best.pid]++}
  return{steps,tot}}
function immoUpAll(only){const P=immoUpPlan(only);if(!P.steps.length){toast('Pas assez d’argent pour des travaux.');sfx('no');return}
  const c0=S.cash;let k=0;quiet(()=>P.steps.forEach(pid=>{const l=S.props[pid];if(l<3)renovProp(pid);else if(l===3)rebuild(pid);if(S.props[pid]>l)k++}));
  sfx('rank');immoLog(`Travaux : ${k} chantier${k>1?'s':''} pour ${fmt(c0-S.cash)}.`);toast(`${k} chantier${k>1?'s':''} terminé${k>1?'s':''} pour ${fmt(c0-S.cash)}.`)}
function immoFixPlan(){const list=propsList().filter(o=>S.props[o.pid]&&imCond(o.pid)<85).sort((a,b)=>immoFixCost(a)-immoFixCost(b)),got=[];let tot=0;
  for(const o of list){const c=immoFixCost(o);if(tot+c>S.cash)break;got.push(o);tot+=c}return{list:got,tot}}
function immoFixAll(){const P=immoFixPlan();if(!P.list.length){sfx('no');return}const c0=S.cash;quiet(()=>P.list.forEach(o=>immoFix(o.pid)));sfx('good');toast(`Entretien de ${P.list.length} bien${P.list.length>1?'s':''} : ${fmt(c0-S.cash)}.`)}
function immoRepPlan(){const list=propsList().filter(o=>S.props[o.pid]&&S.immo.iss[o.pid]).sort((a,b)=>immoRepCost(a)-immoRepCost(b)),got=[];let tot=0;

/* Boutiques : ouvertures, gérants, améliorations (et pour une seule boutique : personnel puis niveaux avec le reste) */
function shopPlan(only,kinds){
  const want=k=>!kinds||kinds.includes(k),items=[];
  BIZ.forEach(b=>{if(only&&b.id!==only)return;const st=S.biz[b.id];
    if(!st.lvl&&want('open'))items.push({k:'open',id:b.id,c:b.cost});
    if(!st.mgr&&want('mgr'))items.push({k:'mgr',id:b.id,c:MGR[b.id],dep:st.lvl?null:b.id});
    if(want('upg'))UPG.forEach(u=>{if(u.biz===b.id&&!S.upg.includes(u.id))items.push({k:'upg',id:u.id,c:u.cost,dep:st.lvl?null:b.id})});
    if(only&&st.lvl&&want('staff')){const s=st.staff||{clean:0,wait:0,qual:0};['clean','wait','qual'].forEach(k=>{for(let v=s[k]|0;v<3;v++)items.push({k:'staff',id:b.id,s:k,c:staffCost(b,v)})})}});
  if(!only&&want('upg'))UPG.forEach(u=>{if(!u.biz&&!S.upg.includes(u.id))items.push({k:'upg',id:u.id,c:u.cost})});
  items.sort((a,b)=>a.c-b.c);
  const got=[],opened=new Set();let tot=0;
  for(const it of items){if(tot+it.c>S.cash)break;if(it.dep&&!opened.has(it.dep))continue;got.push(it);tot+=it.c;if(it.k==='open')opened.add(it.id)}
  let lv=0;if(only&&want('lvl')){const b=BIZ_BY[only],st=S.biz[only];if(st.lvl||opened.has(only)){const l=Math.max(1,st.lvl),c=b.cost*Math.pow(b.m,l),room=S.cash-tot;
    if(room>=c){lv=Math.floor(Math.log(room*(b.m-1)/c+1)/Math.log(b.m));if(lv>0)tot+=costN(b,l,lv)}}}
  return{items:got,lv,tot,n:got.length}}
function shopRun(only,kinds){const P=shopPlan(only,kinds);if(!P.n&&!P.lv){toast('Rien d’abordable pour l’instant.');sfx('no');return}
  const c0=S.cash;let k=0;
  quiet(()=>{P.items.forEach(it=>{if(it.k==='open'){if(!S.biz[it.id].lvl&&S.cash>=BIZ_BY[it.id].cost){buyBiz(it.id);k++}}
    else if(it.k==='mgr'){if(S.biz[it.id].lvl&&!S.biz[it.id].mgr&&S.cash>=MGR[it.id]){hireMgr(it.id);k++}}
    else if(it.k==='upg'){const u=UPG.find(x=>x.id===it.id);if(u&&(!u.biz||S.biz[u.biz].lvl)&&S.cash>=u.cost){buyUpg(it.id);k++}}
    else if(it.k==='staff'){const s=S.biz[it.id].staff;if(s&&s[it.s]<3&&S.cash>=staffCost(BIZ_BY[it.id],s[it.s])){hireStaff(it.id,it.s);k++}}});
    if(P.lv&&only){const b=BIZ_BY[only],st=S.biz[only];if(st.lvl){const c=costN(b,st.lvl,P.lv);let n=P.lv;if(c>S.cash)n=Math.max(0,Math.floor(Math.log(S.cash*(b.m-1)/(b.cost*Math.pow(b.m,st.lvl))+1)/Math.log(b.m)));
      if(n>0){spend(costN(b,st.lvl,n));st.lvl+=n;st.q.wait=clamp(st.q.wait-.12*n,0,100)}}}});
  computeNb();sfx('rank');toast(`${only?BIZ_BY[only].e+' Au max':'Tout acheté'} : ${k} achat${k>1?'s':''}${P.lv?` et ${P.lv} niveau${P.lv>1?'x':''}`:''} pour ${fmt(c0-S.cash)}.`)}

  if(!S.meta||typeof S.meta!=='object'||Array.isArray(S.meta)){const acc=metaGet(META_LS.acc)||{},m={};META_ACC_KEYS.forEach(k=>{if(acc[k]!==undefined)m[k]=acc[k]});S.meta=m}
  fillDefaults(META_DEF(),S.meta);const m=S.meta;
  if(!Array.isArray(m.owned))m.owned=[];if(!Array.isArray(m.fresh))m.fresh=[];if(!m.eq||typeof m.eq!=='object')m.eq=META_DEF().eq;if(!isFinite(m.jetons)||m.jetons<0)m.jetons=0;if(!isFinite(m.jokers))m.jokers=0;
  if(!m.ent||!Array.isArray(m.ent.premium))m.ent={pass:null,premium:[]};
  return m;
}
function metaSave(){const m=metaInit(),a={};META_ACC_KEYS.forEach(k=>a[k]=m[k]);metaSet(META_LS.acc,a)}
const metaHasPass=()=>{const p=metaInit().ent.pass;return !!(p&&p.until>metaNow())};
function metaGain(n,why){if(metaActiveId()==='jetons')n*=2;const m=metaInit();m.jetons+=n;metaSave();if(why)toast(`🎟️ +${n} jetons : ${why}`);return n}

/* Succès : [actuel, objectif] sans jamais planter */
function metaAchP(it){try{const p=it.ach.p?it.ach.p():[it.ach.ok()?1:0,1];return[Math.max(0,+p[0]||0),p[1]]}catch(e){return[0,1]}}
const metaAchDone=it=>{const p=metaAchP(it);return p[0]>=p[1]};
/* Renvoie pourquoi l'objet est disponible ('' = verrouillé) */
function metaOwn(it){const m=metaInit();
  if(it.free||m.owned.includes(it.id))return 'own';
  if(it.ach&&metaAchDone(it))return 'ach';
  if(it.prem&&m.ent.premium.includes(it.id))return 'prem';
  if(it.pass&&metaHasPass())return 'pass';
  if(it.poll&&metaActiveId()===it.poll)return 'poll';
  return '';
}
/* Un succès atteint une fois reste acquis (même si la série retombe) */
function metaUnlockScan(quiet){const m=metaInit(),got=[];
  META_ITEMS.forEach(it=>{if(it.ach&&!m.owned.includes(it.id)&&metaAchDone(it)){m.owned.push(it.id);got.push(it);if(!quiet)m.fresh.push(it.id)}});
  if(!got.length)return;m.fresh=m.fresh.slice(-30);metaSave();
  if(!quiet)toast(got.length>1?`Collection : ${got.length} nouveaux objets à la boutique`:`Débloqué : ${got[0].n} (${META_RAR[got[0].r]||'Commun'})`)}
let META_PREVIEW=null,META_PREV_T=0;
function metaEq(k){if(META_PREVIEW&&META_PREVIEW.k===k)return META_BY[META_PREVIEW.id];
  const it=META_BY[metaInit().eq[k]];return it&&it.k===k&&metaOwn(it)?it:META_ITEMS.find(i=>i.k===k&&i.free)}
function metaClubCol(){return metaEq('club').sw}
function metaApply(){
  const m=metaInit(),th=metaEq('theme'),root=document.documentElement;
  if(th.id==='th_classic')root.removeAttribute('data-skin');else root.setAttribute('data-skin',th.id.slice(3));
  const av=metaEq('avatar');
  if(av.id!=='av_none'){if(!m.baseAv||m.baseAv.name!==S.hero.name)m.baseAv={av:S.hero.av,name:S.hero.name};S.hero.av=av.e}
  else if(m.baseAv){if(m.baseAv.name===S.hero.name)S.hero.av=m.baseAv.av;m.baseAv=null}
  if(av.g){root.setAttribute('data-av',av.id.slice(3));root.style.setProperty('--av-bg',`linear-gradient(150deg,${av.g[0]},${av.g[1]})`);root.style.setProperty('--av-ring',av.ring||'var(--ink)')}
  else{root.removeAttribute('data-av');root.style.removeProperty('--av-bg');root.style.removeProperty('--av-ring')}
  if(typeof skDecoRender==='function')skDecoRender();
}
function metaRain(){if(typeof RM!=='undefined'&&RM)return;if(typeof skRain==='function')skRain(metaEq('rain'))}

function metaPoll(week){const out=[];let h=metaHash('poll'+week);let g=0;while(out.length<4&&g++<500){const id=META_POLL[h%META_POLL.length].id;if(!out.includes(id))out.push(id);h=metaHash(week+':'+h)}for(const q of META_POLL){if(out.length>=4)break;if(!out.includes(q.id))out.push(q.id)}return{week,opts:out}}
const metaSimVotes=(week,o)=>3+metaHash(week+'|'+o)%12;
function metaCounts(week){const p=metaPoll(week),all=(metaGet(META_LS.votes)||{})[week]||{},counts={};
  p.opts.forEach(o=>counts[o]=metaSimVotes(week,o));Object.values(all).forEach(o=>{if(o in counts)counts[o]++});
  return{week,counts,total:Object.values(counts).reduce((a,b)=>a+b,0),mine:all[BACKEND.playerId()]||null}}
function metaWinnerOf(r){const p=metaPoll(r.week);return p.opts.reduce((best,o)=>r.counts[o]>r.counts[best]?o:best,p.opts[0])}
function metaActiveId(){if(!S||!S.meta)return null;const w=metaWeekOff(-1);return S.meta.winners[w]||metaWinnerOf(metaCounts(w))}
async function metaPollCheck(){
  if(!S.started||S.dead)return;const m=metaInit(),w=metaWeek();if(m.pollDone===w)return;
  m.pollDone=w;const prev=metaWeekOff(-1),r=await BACKEND.results(prev),win=metaWinnerOf(r),o=META_POLL_BY[win];
  m.winners[prev]=win;Object.keys(m.winners).sort().slice(0,-8).forEach(k=>delete m.winners[k]);
  const extra=o.once?o.once():'';metaSave();metaApply();render();
  queueModal(`<div class="reveal-box pop">🗳️</div><h2>Le vote a parlé !</h2><p>La semaine dernière, les joueurs ont choisi :</p><div class="meta-win">${o.e} <b>${o.t}</b><p class="hint">${o.d}</p>${extra?`<div class="big-num">${extra}</div>`:''}</div><p class="hint">Un nouveau sondage t’attend cette semaine.</p><div style="display:grid;gap:8px;margin-top:16px"><button class="btn big go" data-a="meta_poll">Voter pour la semaine prochaine</button><button class="btn ghost" data-a="close">Plus tard</button></div>`);
}
async function metaPollHTML(){
  const m=metaInit(),w=metaWeek(),p=metaPoll(w),r=await BACKEND.results(w),mine=m.votes[w]||r.mine,act=META_POLL_BY[metaActiveId()];
  const end=7-((new Date(metaNow()).getDay()+6)%7);
  const opts=mine?p.opts.map(o=>{const x=META_POLL_BY[o],pc=Math.round(r.counts[o]/r.total*100);return `<div class="meta-res ${o===mine?'me':''}"><span>${x.e} ${x.t}${o===mine?' · ton vote':''}</span><b>${pc} %</b><i style="width:${pc}%"></i></div>`}).join('')
    :p.opts.map(o=>{const x=META_POLL_BY[o];return `<button class="meta-opt" data-a="meta_vote" data-id="${o}"><b>${x.e} ${x.t}</b><span class="hint">${x.d}</span></button>`}).join('');

async function metaVote(o){

/* ---------- Série, jokers, coffre du jour (complète l'original) ---------- */
const metaJokerMax=()=>metaHasPass()?3:2;
let META_JOKER_USE=0;
function metaStreakLeft(){const last=metaParseDay(S.lastDaily);if(last==null||!S.streak)return null;const dl=last+1+metaInit().jokers;return{left:dl-metaDayNum(metaNow()),dl}}
function metaStreakLine(){const s=metaStreakLeft(),j=metaInit().jokers;if(!s)return 'Ouvre ton coffre du jour pour lancer une série.';
  if(s.left<0)return 'Ta série s’est arrêtée. Ouvre le coffre pour en lancer une nouvelle !';
  const jk=j?` · 🃏 ${j} joker${j>1?'s':''}`:'';
  if(s.left===0)return `🔥 Série de ${S.streak} jour${S.streak>1?'s':''}${jk}. Dernier jour pour la garder : ouvre ton coffre aujourd’hui !`;
  return `🔥 Série de ${S.streak} jour${S.streak>1?'s':''}${jk}. Il te reste ${s.left} jour${s.left>1?'s':''} avant de perdre ta série (jusqu’au ${metaDayLabel(s.dl)} soir).`}
function dailyModal(){
  metaInit();const last=metaParseDay(S.lastDaily),gap=last==null?99:metaDayNum(metaNow())-last;let cont=S.lastDaily===yesterday();META_JOKER_USE=0;
  if(!cont&&S.streak>0&&gap>=2&&gap-1<=S.meta.jokers){cont=true;META_JOKER_USE=gap-1}
  const next=cont?S.streak+1:1,pos=((next-1)%7)+1,mult=(pos===7?3:1)*(metaActiveId()==='coffre'?2:1);
  const reward=Math.max(250*next,autoIncome()*120*Math.min(next,7))*mult;
  queueModal(`<div class="reveal-box pop">🎁</div><h2>Coffre du jour</h2>
    <p>Un coffre par jour. Le 7e jour d’affilée, il vaut triple.</p>
    <div class="streak">${[1,2,3,4,5,6,7].map(d=>`<div class="${d<pos?'got':d===pos?'now':''}">${d===7?'🎁':'J'+d}</div>`).join('')}</div>
    <div class="big-num">+${fmt(reward)}</div><p class="hint">Série : ${next} jour${next>1?'s':''} · 🎟️ +${pos===7?10:5} jetons${metaActiveId()==='coffre'?' · 🎁 Coffre XXL ×2':''}</p>
    ${META_JOKER_USE?`<p class="hint">🃏 ${META_JOKER_USE} joker${META_JOKER_USE>1?'s':''} utilisé${META_JOKER_USE>1?'s':''} : ta série est sauvée !</p>`:''}
    ${!cont&&S.streak>1?`<p class="hint">Ta série de ${S.streak} jours s’est arrêtée. Astuce : chaque 7e jour te donne un joker qui pardonne un jour manqué.</p>`:''}
    <button class="btn big go" style="margin-top:16px" data-a="daily" data-r="${reward}" data-s="${next}">Ouvrir le coffre</button>`);
}
function metaOnDaily(){const m=metaInit();
  if(META_JOKER_USE){m.jokers=Math.max(0,m.jokers-META_JOKER_USE);META_JOKER_USE=0}
  const pos=((S.streak-1)%7)+1;let g=pos===7?10:5;if(metaHasPass())g=Math.ceil(g*1.25);metaGain(g);
  if(pos===7&&m.jokers<metaJokerMax()){m.jokers++;toast('🃏 Joker de série gagné : un jour manqué te sera pardonné.')}
  metaSave();metaRain();
}

  m.jetons-=it.cost;m.owned.push(id);m.eq[it.k]=id;META_PREVIEW=null;metaSave();metaApply();render();sfx('rank');metaRain();metaOpenShop(`« ${it.n} » est à toi, et déjà équipé.`)}

/* Direction artistique de la carte : « maquette peinte à la main »

 2. Un seul trait d’encre (0,8 px monde, encre de la ville) sur la silhouette des volumes. Aucun dégradé sur les façades.
 3. Palette resserrée par ville : 3 à 5 enduits, 2 toitures, 1 menuiserie, 1 encre, 1 verre. La couleur d’un commerce ne va que sur son store et son enseigne.
 4. Toute façade = un socle sombre au pied + des étages aux fenêtres de la ville + un couronnement (corniche, toit ou mobilier de toit).
 5. Verre gris-bleu le jour ; la nuit 7 fenêtres sur 10 en jaune chaud. Néons seulement à Tokyo.
 6. Un détail signature par ville, pas plus : paraboles, ardoise, génoises, zinc et balcons, cheminées, escaliers de secours, enseignes verticales, tours à vent.
 7. Un commerce montre son niveau : vitrine qui s’élargit, store, enseigne peinte, jardinières, enseigne de toit allumée la nuit, drapeaux, corniche dorée.
 8. Chaque maison varie par un tirage fixe (enduit, toit, cheminée, porte, jardinière), jamais au hasard d’une image à l’autre.
 9. Les petits détails ne se dessinent qu’à partir d’un zoom suffisant : lisible et fluide sur téléphone.

function pickEvent(){
  decInit();
  const due=S.sched.filter(s=>s.day<=S.day).sort((a,b)=>a.day-b.day);
  if(due.length){const s=due[0];S.sched=S.sched.filter(x=>x!==s);if(EV[s.id]&&(!EV[s.id].cond||EV[s.id].cond())){prepEv(EV[s.id]);return [s.id,s.data]}}
  if(S.partner&&S.partner.rel<10&&EV.rupture)return ['rupture',{}];
  if(S.day<S.nextEv||!openIds().length)return null;
  if(S.day-(S.flags.decLastEv||-99)<2)return null;
  if(S.energy<25&&EV.fatigue&&(!S.flags.fatigueLast||S.day-S.flags.fatigueLast>4)){S.flags.fatigueLast=S.day;S.flags.decLastEv=S.day;return ['fatigue',{}]}
  const mem=S.evMem,lastCat=S.flags.decLastCat;
  const pool=EV_POOL.filter((k,i,a)=>{const E=EV[k];if(a.indexOf(k)!==i||!E||E.sched||(E.once&&S.flags['done_'+k])||mem.includes(k))return false;
    if(S.evSeen[k]&&S.day-S.evSeen[k]<(E.cool||40))return false;try{return !E.cond||!!E.cond()}catch(e){return false}});
  if(!pool.length)return null;
  const wt=k=>{const E=EV[k];let w=E.w||4;if(!S.evSeen[k])w*=1.8;if(E.ctx)w*=1.6;if((E.cat||'business')===lastCat)w*=.45;return w};
  let tot=pool.reduce((a,k)=>a+wt(k),0),r=Math.random()*tot;
  for(const k of pool){if((r-=wt(k))<0){S.flags['last_'+k]=S.day;S.flags.decLastEv=S.day;S.flags.decLastCat=EV[k].cat||'business';mem.push(k);if(mem.length>12)mem.shift();prepEv(EV[k]);return [k,{}]}}
  return null;
}

  Object.keys(QK).forEach(k=>{const a=ACTS.find(x=>x.k===k);if(!a||cd[a.id]>S.day||st.q[k]>=95)return;L.push({id,k,a,c:actCost(b,a),q:st.q[k]})})});
  return L.sort((x,y)=>x.q-y.q)}
function ryHirePlan(){const L=[];openIds().forEach(id=>{const b=BIZ_BY[id],st=S.biz[id];if(!b||!st)return;const s=st.staff||{clean:0,wait:0,qual:0};
  Object.keys(QK).forEach(k=>{if((s[k]|0)<3)L.push({id,k,c:staffCost(b,s[k]|0),q:st.q[k]})})});return L.sort((x,y)=>x.c-y.c)}
function ryFixAll(){const L=ryFixPlan();let n=0,spent=0,lowE=false,lowC=false;
  for(const it of L){const st=S.biz[it.id];if(S.cash<it.c){lowC=true;continue}if(S.energy<it.a.nrg){lowE=true;continue}
    spend(it.c);spent+=it.c;S.energy=clamp(S.energy-it.a.nrg,0,100);st.q[it.k]=clamp(st.q[it.k]+it.a.gain,0,100);st.cd[it.a.id]=S.day+it.a.cd;S.counts.actions++;n++}
  if(!n){toast(lowE?'Trop crevé pour ça ce mois-ci.':lowC?'Pas assez d’argent pour régler quoi que ce soit.':'Rien à régler pour l’instant.');sfx('no');return}
  addXP(5*n);sfx('good');toast(`${n} coup${n>1?'s':''} de boost payé${n>1?'s':''} (${fmt(spent)}).${n<L.length?` ${L.length-n} en attente : ${lowE?'plus d’énergie':'plus assez d’argent'}.`:''}`)}
function ryHireAll(){const L=ryHirePlan();let n=0,spent=0;
  for(const it of L){if(S.cash<it.c)break;const st=S.biz[it.id],s=st.staff||(st.staff={clean:0,wait:0,qual:0});spend(it.c);spent+=it.c;s[it.k]=(s[it.k]|0)+1;st.q[it.k]=clamp(st.q[it.k]+25,0,100);S.counts.actions++;n++}
  if(!n){toast('Pas assez d’argent pour une embauche.');sfx('no');return}
  addXP(10*n);sfx('rank');toast(`${n} embauche${n>1?'s':''} définitive${n>1?'s':''} (${fmt(spent)}).`)}

function mxOp(X){return X.oppStr+(X.home?0:3)-X.opRed*6}

const VL_FURN={8:[['parasol','bush','bench'],[['#F2C230','#2FA36B'],['#D1495B','#F7F3EA'],['#2E86AB','#F2C230']]],9:[['lantern','planter','bench'],[['#C8102E','#F2C230'],['#B5443A','#ECE6DB']]],10:[['coral','anemone','coral'],[['#FF7F9F','#FFB86B'],['#B48CFF','#7FE3F0'],['#FF6B6B','#FFD447']]],12:[['solar','beacon','solar'],[['#C5CBD3','#E8D5C6']]]};

/* ---------- Sol : Mars rouille, fond marin bleuté ---------- */
buildGround=(f=>function(){f();if(!(TH_.mars||TH_.sea))return;const g=G.cv.getContext('2d');g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=TH_.mars?.55:.22;g.fillStyle=TH_.mars?'#B4552C':'#2A9FC0';g.fillRect(0,0,G.cv.width,G.cv.height);g.restore()})(buildGround);

/* ---------- Ciel : eau profonde à Atlantide, petites lunes sur Mars ---------- */
c2Horizon=function(ci,par,hz){
  const top=toScreen(iso(0,0)[0],iso(0,0)[1])[1],base=top+14*cam.z,ha=clamp((base-70)/90,0,1);if(ha<=0)return;
  const key=ci+'|'+G.bucket+'|'+Math.round(MW);
  if(C2H.key!==key){C2H.key=key;const W=Math.ceil(MW*2.4),H=130,cv=C2H.cv||document.createElement('canvas');cv.width=W;cv.height=H;C2H.cv=cv;const g=cv.getContext('2d'),R=mulberry(77+ci),by=H-8;
    const far=c2Rgb(c2Lerp3(c2Lerp3(c2Hex(['#A4CFA6','#A6C8B8','#C2B79C','#AEB9CA','#A9B2BE','#94A8C2','#A8BCD2','#EACDA2','#7FAF8A','#9FB0C0','#1F6F8A','#3A3654','#B0704E'][ci]),c2Hex('#E4A08E'),DUSK*.5),[24,32,70],NIGHT*.82));
    const near=c2Rgb(c2Lerp3(c2Lerp3(c2Hex(['#86BE86','#8BBA9C','#CC9C78','#97A4B6','#929AA6','#7A8EAB','#8AA2C0','#E2BC8A','#5E9A6A','#8496AA','#165A72','#2C2944','#93573C'][ci]),c2Hex('#C9867A'),DUSK*.5),[18,24,58],NIGHT*.84));
    const layer=(fill,amp,step,kind,off)=>{g.fillStyle=fill;g.beginPath();g.moveTo(0,H);g.lineTo(0,by-off);let x=0;
      for(let it=0;it<400&&x<W;it++){const h=amp*(.45+R()*.55);
        if(kind==='hill'){const w=step*(1+R());g.quadraticCurveTo(x+w/2,by-off-h*1.6,x+w,by-off);x+=w}
        else if(kind==='city'){const w=step*(.6+R()*.8);g.lineTo(x,by-off-h);if(R()<.4){g.lineTo(x+w/2,by-off-h-amp*.35)}g.lineTo(x+w,by-off-h);x+=w+(R()<.3?4:0);g.lineTo(x,by-off-h*.3)}
        else if(kind==='tower'){const w=step*(.5+R()*.6),hh=h*(R()<.3?2.2:1);g.lineTo(x,by-off-hh);if(R()<.3)g.lineTo(x+w/2,by-off-hh-amp*.5);g.lineTo(x+w,by-off-hh);g.lineTo(x+w,by-off);x+=w+R()*6;g.lineTo(x,by-off)}
        else if(kind==='dune'){const w=step*(1.4+R());g.quadraticCurveTo(x+w*.3,by-off-h,x+w,by-off);x+=w}
        else if(kind==='peaks'){const w=step*(.8+R()*.9),hh=h*(R()<.35?1.9:1.1);g.lineTo(x+w*.18,by-off-hh*.55);g.bezierCurveTo(x+w*.22,by-off-hh*1.05,x+w*.5,by-off-hh*1.08,x+w*.6,by-off-hh*.7);g.lineTo(x+w,by-off-h*.15);x+=w}
        else if(kind==='reef'){const w=step*(.5+R()*.6);g.lineTo(x,by-off-h*.4);g.quadraticCurveTo(x+w*.2,by-off-h*1.3,x+w*.45,by-off-h*.6);g.quadraticCurveTo(x+w*.7,by-off-h*1.1,x+w,by-off-h*.3);x+=w}
        else if(kind==='mesa'){const w=step*(1.2+R()*1.4),hh=h*(R()<.25?1.7:1);g.lineTo(x+w*.15,by-off-hh);g.lineTo(x+w*.85,by-off-hh);g.lineTo(x+w,by-off);x+=w+R()*10;g.lineTo(x,by-off)}
        else{const w=step*(1+R());g.lineTo(x+w*.3,by-off-h*.5);g.quadraticCurveTo(x+w*.5,by-off-h,x+w*.7,by-off-h*.5);g.lineTo(x+w,by-off);x+=w}}
      g.lineTo(W,H);g.closePath();g.fill()};
    const K=[['hill','hill'],['hill','hill'],['hill','city'],['hill','city'],['city','city'],['tower','tower'],['city','tower'],['dune','tower'],['peaks','city'],['tower','tower'],['reef','reef'],['crater','crater'],['mesa','crater']][ci]||['crater','crater'];
    const AF={5:46,7:46,8:58,9:52,10:40,12:50}[ci]||30,SF={8:46,10:16,12:44}[ci]||(ci>=5?18:38),AN={5:34,7:26,8:16,9:30,10:30}[ci]||18,SN=ci===10?12:ci>=4?14:30;
    layer(far,AF,SF,K[0],12);layer(near,AN,SN,K[1],0);
    if(ci===6||ci===4||ci===5||ci===8||ci===9){g.fillStyle=NIGHT>.45?'rgba(255,214,120,.8)':'rgba(255,255,255,0)';if(NIGHT>.45)for(let i=0;i<120;i++){g.fillRect(R()*W,by-R()*40,1.5,1.5)}}
    const fg=g.createLinearGradient(0,by-46,0,H);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(.85,hz);fg.addColorStop(1,hz);g.globalCompositeOperation='source-atop';g.fillStyle=fg;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over'}
  ctx.save();ctx.globalAlpha=ha;ctx.beginPath();ctx.rect(0,0,MW,Math.max(0,base));ctx.clip();ctx.drawImage(C2H.cv,MW/2-par*.6-C2H.cv.width/2,base-C2H.cv.height+8);ctx.restore();
};
const vlSky0=drawSky;
drawSky=function(){
  if(!TH_.sea){vlSky0();if(TH_.mars)vlMarsSky();return}
  ctx.setTransform(DPR,0,0,DPR,0,0);const n=NIGHT,ci=Math.min(gfxL(),CP.length-1),par=(cam.x*.05)%MW;
  const mix=(a,b)=>c2Rgb(c2Lerp3(c2Hex(a),c2Hex(b),n*.85));
  const g=ctx.createLinearGradient(0,0,0,MH);g.addColorStop(0,mix('#5CCBE4','#0B3550'));g.addColorStop(.4,mix('#1F95BC','#072A44'));g.addColorStop(1,mix('#0E5C80','#041C30'));ctx.fillStyle=g;ctx.fillRect(0,0,MW,MH);

  ctx.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const x=((i*173-par*2+(GFX.thumb?0:T)*5)%(MW+260)+MW+260)%(MW+260)-130;ctx.globalAlpha=Math.max(0,(.06+.035*Math.sin(T*.7+i*1.9))*(1-n*.85));poly(ctx,[[x,0],[x+34+i*4,0],[x+150,MH*.75],[x+70,MH*.75]],'#C8F6FF')}

  const wx=((GFX.thumb?MW*.3:T*7)%(MW+500))-250,wy=MH*.16+Math.sin(T*.3)*6;ctx.fillStyle=mix('#155D7E','#06283E');ctx.globalAlpha=.85;ctx.beginPath();ctx.ellipse(wx,wy,54,15,-.04,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(wx-48,wy);ctx.lineTo(wx-78,wy-14+Math.sin(T*1.5)*4);ctx.lineTo(wx-72,wy+2);ctx.lineTo(wx-80,wy+14+Math.sin(T*1.5)*4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(wx+6,wy+12,14,4,.5,0,7);ctx.fill();ctx.globalAlpha=1;
  c2Horizon(ci,par,mix('#0E5C80','#041C30'));
};
function vlMarsSky(){ctx.setTransform(DPR,0,0,DPR,0,0);const par=(cam.x*.05)%MW;
  const s=[MW*.22-par*.3,MH*.12],g=ctx.createRadialGradient(s[0],s[1],2,s[0],s[1],36);g.addColorStop(0,'rgba(220,240,255,.9)');g.addColorStop(.3,'rgba(160,200,235,.35)');g.addColorStop(1,'rgba(160,200,235,0)');ctx.fillStyle=g;ctx.fillRect(s[0]-36,s[1]-36,72,72);
  ctx.fillStyle='#F6F8FF';ctx.beginPath();ctx.arc(s[0],s[1],6,0,7);ctx.fill();
  const p=[MW*.74-par*.5,MH*.1];ctx.fillStyle='#8A7466';ctx.beginPath();ctx.ellipse(p[0],p[1],9,6.5,.4,0,7);ctx.fill();ctx.fillStyle='#6E5A4E';ctx.beginPath();ctx.arc(p[0]+2,p[1]+1,2,0,7);ctx.fill();
  ctx.fillStyle='#A08A7C';ctx.beginPath();ctx.arc(MW*.86-par*.5,MH*.2,3,0,7);ctx.fill();ctx.fillStyle='#7FB8FF';ctx.beginPath();ctx.arc(MW*.6-par*.4,MH*.07,1.6,0,7);ctx.fill()}

/* ---------- Particules : bulles et poissons sous la mer, poussière rouge sur Mars ---------- */
const vlSig0=gfxSig;
gfxSig=function(L){if(TH_.sea)return 'bubble|false|'+L;if(TH_.mars)return 'rdust|false|'+L;return vlSig0(L)};
const vlParts0=gfxParts;
gfxParts=function(dt){if(TH_.sea)for(const p of GFX.parts)if(p.k==='bird')p.k='fish';vlParts0(dt);if(!TH_.sea&&!TH_.mars)return;
  if(TH_.sea&&GFX.parts.length<26)for(let i=0;i<10;i++)GFX.parts.push({k:'bubble',x:Math.random()*MW,y:Math.random()*MH,v:rand(.6,1.4),ph:Math.random()*7});
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const p of GFX.parts){
    if(p.k==='bubble'){p.y-=dt*20*p.v;p.x+=Math.sin(p.ph*.8)*dt*8;ctx.strokeStyle='rgba(220,250,255,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,1.4+p.v*1.5,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(p.x-p.v*.8,p.y-p.v*.9,1.2,1.2)}
    else if(p.k==='rdust'){p.x+=dt*22*p.v;p.y+=Math.sin(p.ph)*dt*3;ctx.fillStyle='rgba(240,170,120,.55)';ctx.fillRect(p.x,p.y,2.2,1.2)}
    else if(p.k==='fish'){p.x+=dt*16*p.v;const w=Math.sin(p.ph*3)*1.6,c=['#FFB347','#7FE3FF','#FF7F9F'][(p.v*10|0)%3];ctx.fillStyle=c;ctx.globalAlpha=.9;ctx.beginPath();ctx.ellipse(p.x,p.y,5,2.4,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(p.x-4,p.y);ctx.lineTo(p.x-8,p.y-3+w);ctx.lineTo(p.x-8,p.y+3+w);ctx.closePath();ctx.fill();ctx.globalAlpha=1}
    if(p.y<-12){p.y=MH+8;p.x=Math.random()*MW}if(p.x>MW+12)p.x=-10}
};

/* ---------- Bâtiments achetés, rénovés ou reconstruits : ils gardent le style de leur ville ----------
   On dessine le bâtiment avec le rendu de la ville (même façade, même toit), à sa hauteur réelle,
   puis on ajoute des marques discrètes de propriété : corniche dorée, fanion, jardinières, lumière. */
const vlHouse0=drawHouse;
drawHouse=function(o){const l=(S.props&&S.props[o.pid])||0,up=((S.propUp||{})[o.pid])||0;
  if(TH_.dome||(!l&&!up))return vlHouse0(o);
  const ff=o.f+up,c=Object.assign({},o,{f:ff,pid:undefined,roof:!!o.roof&&!up});
  const r=vlHouse0(c);try{vlOwnMarks(o,r,ff,l)}catch(e){}return r};
function vlOwnMarks(o,r,ff,l){if(!r||!r.fL)return;const h=ff*FH,gold='#E0B84A',P=cPal();
  q(r.fL,0,1,h-1.4,h,shade(gold,1));q(r.fR,0,1,h-1.4,h,shade(gold,.8));
  if(l>=2&&cLod())cPlanter(r.fL,.06,.3,2.2);
  if(l>=4){for(const f of [r.fL,r.fR])for(let fl=1;fl<ff;fl++)q(f,0,1,fl*FH,fl*FH+.8,shade(P.trim,1));
    if(NIGHT>.3){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.45*NIGHT;q(r.fL,0,1,h-3,h,'#FFD45E');q(r.fR,0,1,h-3,h,'#FFD45E');ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}}
  const t=r.top;if(!t)return;const ph=l>=3?14:9;ctx.strokeStyle=shade('#5A5F66',1);ctx.lineWidth=.9;line(t,[t[0],t[1]-ph]);ctx.fillStyle=shade(l>=3?gold:'#D1495B',1);
  ctx.beginPath();ctx.moveTo(t[0],t[1]-ph);ctx.lineTo(t[0]+7+Math.sin(T*3+o.x)*.8,t[1]-ph+2.2);ctx.lineTo(t[0],t[1]-ph+4.4);ctx.closePath();ctx.fill()}
/* ===== FIN AGENT VILLES ===== */
/* ================= BOOT ================= */
(function boot(){
  applyCityBiz(S.city);
  if(!S.mkt||!Array.isArray(S.mkt.a)){const old=S.mkt;S.mkt=freshMkt();
    if(old){S.mkt.profit=+old.profit||0;S.mkt.cap=+old.cap||0;if(old.qty>0){S.mkt.a[0].qty=old.qty;S.mkt.a[0].avg=+old.avg||S.mkt.a[0].price}}}
  mktMigrate(S.mkt);
  if(S.event&&!EV[S.event.id])S.event=null;
  S.sched=(S.sched||[]).filter(s=>s&&EV[s.id]);
  genCity(S.city);
  /* Absence : gains plafonnés et écran de retour (voir ryAway, bloc AGENT RYTHME) */
  const away=S.started&&!S.dead?Math.max(0,(Date.now()-(S.lastSeen||Date.now()))/1000):0;
  dispCash=S.cash;S.tab=S.tab||'ville';normTab();if(!ongTabs().includes(S.tab))S.tab='ville';
  render();camTo(11,10,true);
  for(let i=0;i<14;i++){spawnPed();const e=ENTS[ENTS.length-1],a=e.pts[0],b=e.pts[1],k=Math.random();e.x=a[0]+(b[0]-a[0])*k;e.y=a[1]+(b[1]-a[1])*k}
  setInterval(tick,100);requestAnimationFrame(frame);
  if(!S.started){intro();return}
  if(S.dead){modal(heirsHTML());return}
  ryInit();if(S.paused)toast('Le jeu est en pause. Touche « Reprendre » en haut pour relancer le temps.');else if(away>30)ryAway(away,true);
  if(S.lastDaily!==today())dailyModal();
  if(S.event)queueModal(eventHTML(false));
})();
