<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E2B2A">
<meta name="fe-build" content="2026-11-04-0946">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip Empire">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Flip Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DCE3E0; --surface:#FFFFFF; --surface2:#EEF2F0; --ink:#1E2B2A; --muted:#566663; --line:#C3CDC9;
  --sticker:#F7E733; --sticker-ink:#1E2B2A; --money:#17834A; --loss:#C2362B; --pink:#FF5FA2;
  --me:#1E2B2A; --me-ink:#FFFFFF; --them:#FFFFFF; --stamp:#C2362B;
  --maptop:150px; --mapbot:64px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141D1C; --surface:#1F2B2A; --surface2:#283736; --ink:#E6EEEB; --muted:#9DADA9; --line:#35463F;
    --money:#3DD68C; --loss:#FF6B5E; --me:#E6EEEB; --me-ink:#141D1C; --them:#283736; --stamp:#FF6B5E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141D1C; --surface:#1F2B2A; --surface2:#283736; --ink:#E6EEEB; --muted:#9DADA9; --line:#35463F;
  --money:#3DD68C; --loss:#FF6B5E; --me:#E6EEEB; --me-ink:#141D1C; --them:#283736; --stamp:#FF6B5E;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.ville{overflow:hidden}
h1,h2,h3,p{margin:0}
.app{max-width:560px;margin:0 auto;padding:0 14px 110px}
body.ville .app{padding-bottom:0}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cash{font-weight:800;font-size:2.1rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transform-origin:left center;transition:transform .14s}
.cash.bump{transform:scale(1.06)}
.ips{color:var(--money);font-weight:700;font-size:.88rem;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;color:var(--muted);font-size:.84rem;align-items:center}
.meta span:empty{display:none}
.datechip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink);font-weight:600}
.evchip{background:var(--sticker);color:var(--sticker-ink);border-radius:999px;padding:1px 9px;font-weight:700}
.frz{color:var(--loss);font-weight:800}
.daybar{height:4px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.daybar i{display:block;height:100%;background:var(--ink);width:0}

/* Buttons */
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--surface);cursor:pointer;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:7px 10px;font-size:.86rem}
.btn.big{width:100%;padding:14px;font-size:1.05rem}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.go{background:var(--money);color:#fff}
.btn.boost{background:var(--sticker);color:var(--sticker-ink);white-space:nowrap;font-size:.9rem}
.btn.boost.on{background:var(--pink);opacity:1}
.btn.pinkb{background:var(--pink);color:#1E2B2A}

/* Map */
#mapwrap{position:fixed;left:0;right:0;top:var(--maptop);bottom:var(--mapbot);z-index:5}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:65}
.map-ctrl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:6}
.map-ctrl button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.9);color:#1E2B2A;font:inherit;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.map-hint{position:absolute;left:12px;top:12px;z-index:6;background:rgba(255,255,255,.92);color:#1E2B2A;border-radius:12px;padding:8px 12px;font-size:.85rem;font-weight:600;max-width:62%;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* Bottom sheet */
.bsheet{position:fixed;left:0;right:0;bottom:var(--mapbot);z-index:22;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);max-height:58vh;overflow:auto;padding:12px 16px 18px;animation:sheetin .22s ease-out}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.bs-head{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.bs-ic{width:52px;height:52px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:28px}
.bs-head h2{font-size:1.15rem;line-height:1.2}
.bs-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);font-size:1.1rem;cursor:pointer}
.bs-sec{margin-top:14px}
.bs-sec h3{font-size:.95rem;margin-bottom:6px}
.bs-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted)}
.kv b{color:var(--ink)}

/* Sections */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 4px}
.sec-head h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.sec-head p{color:var(--muted);font-size:.86rem;text-align:right}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;margin-top:12px;color:var(--muted)}
.empty .btn{margin-top:12px}
.hint{font-size:.82rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-top:16px}
.seg button{font:inherit;font-weight:700;font-size:.9rem;border:0;border-radius:9px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .cnt{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--pink);color:#1E2B2A;font-size:.72rem}
.modes{display:flex;gap:4px}
.modes button{font:inherit;font-size:.82rem;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer}
.modes button.on{background:var(--ink);color:var(--surface)}

/* Gestion list */
.gl{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0;padding-top:0}
.gl-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--surface2)}
.gl h3{font-size:.98rem;display:flex;justify-content:space-between;gap:8px}
.gl h3 span{color:var(--money);white-space:nowrap}
.minibar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:6px 0}
.minibar i{display:block;height:100%;background:var(--money);width:0}
.ug{list-style:none;padding:0;margin:0}
.ug li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ug li:first-child{border-top:0}
.ug strong{display:block;font-size:.92rem}
.ug .btn{white-space:nowrap;flex:none}
.ug .done{color:var(--money);font-weight:800;white-space:nowrap}
.ug-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ug-h h3{font-size:1rem}

/* Listing cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;display:grid;grid-template-columns:62px 1fr;gap:12px}
.card.dim{opacity:.5}
.thumb{width:62px;height:62px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:34px;border:4px solid var(--surface);box-shadow:0 0 0 1px var(--line);transform:rotate(-2deg)}
.info h3{font-size:1.05rem;font-weight:700;line-height:1.25}
.sub{color:var(--muted);font-size:.88rem;margin-top:2px}
.cote{font-size:.85rem;margin-top:4px;color:var(--money);font-weight:600}
.row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.tag.rare{background:var(--pink);border-color:transparent;color:#1E2B2A}
.tag.boost{background:var(--sticker);border-color:transparent;color:var(--sticker-ink)}
.sticker{font-family:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;background:var(--sticker);color:var(--sticker-ink);padding:5px 12px 2px;display:inline-block;transform:rotate(-4deg);border-radius:3px;box-shadow:1px 2px 0 rgba(0,0,0,.2);font-size:1.15rem;white-space:nowrap}
.sticker.pink{background:var(--pink)}
.cond{display:flex;gap:3px;margin-top:6px}
.cond i{width:16px;height:6px;border-radius:2px;background:var(--line)}
.cond i.on{background:var(--money)}
.margin{font-weight:700}
.margin.pos{color:var(--money)} .margin.neg{color:var(--loss)}
.offer{grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.offer p{flex:1 1 100%}
.pricer{grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:12px}
.pricer label{display:flex;justify-content:space-between;align-items:center;font-weight:600}
input[type=range]{width:100%;accent-color:var(--ink);margin:10px 0}

/* Negotiation */
.nego-head{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.chat{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.bub{max-width:84%;padding:9px 12px;border-radius:16px;font-size:.95rem}
.bub.them{background:var(--them);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--me);color:var(--me-ink);align-self:flex-end;border-bottom-right-radius:4px}
.bub.sys{align-self:center;color:var(--muted);font-size:.85rem;text-align:center;max-width:92%}
.ctrl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.ctrl output{font-family:"Permanent Marker","Marker Felt",cursive;font-size:1.3rem}
.ctrl .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .line{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.patience{letter-spacing:2px;color:var(--loss)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.chip{font:inherit;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.args{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.args p{font-size:.82rem;color:var(--muted)}
.arg{font:inherit;text-align:left;font-size:.9rem;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
.arg:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}

/* Monde */
.route{position:relative;margin-top:14px;padding:6px 0}
.city{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;position:relative;padding:10px 0}
.city:nth-child(even){margin-left:42px}
.city .pin{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.city.done .pin{border-color:var(--money)}
.city.cur .pin{border-color:var(--ink);background:var(--sticker);box-shadow:0 0 0 6px color-mix(in srgb,var(--sticker) 40%,transparent)}
.city.lock{opacity:.5}
.city h3{font-size:1.05rem}
.city::before{content:"";position:absolute;left:31px;top:-14px;height:28px;border-left:3px dashed var(--line)}
.city:first-child::before{display:none}
.city:nth-child(even)::before{left:31px;transform:skewX(-35deg);transform-origin:bottom}
.city:nth-child(odd):not(:first-child)::before{transform:skewX(35deg);transform-origin:bottom}
.franchise{background:var(--ink);color:var(--surface);border-radius:14px;padding:16px;margin-top:10px}
.franchise .hint{color:inherit;opacity:.75}
.franchise .btn{background:var(--sticker);color:var(--sticker-ink);margin-top:12px}
.vitrine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vitrine div{aspect-ratio:1;border-radius:10px;background:var(--surface2);border:1px dashed var(--line);display:grid;place-items:center;font-size:1.9rem}
.vitrine div.got{border:2px solid var(--pink);background:var(--surface)}

/* Profil */
.missions{list-style:none;padding:0;margin:0}
.missions li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.missions li:first-child{border-top:0;padding-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat strong{display:block;font-size:1.2rem;font-weight:800}
.stat span{color:var(--muted);font-size:.85rem}
.steps{list-style:none;padding:0;margin:0}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.steps li.locked{opacity:.6}
.steps .ic{font-size:1.7rem;width:44px;height:44px;display:grid;place-items:center;background:var(--surface2);border-radius:10px}
.steps h3{font-size:1.05rem}
.steps .btn{margin-top:10px}
.xpbar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:var(--pink)}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.streak div{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--muted)}
.streak .got{background:var(--money);color:#fff}
.streak .now{background:var(--sticker);color:var(--sticker-ink);box-shadow:0 0 0 2px var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.foot{margin-top:24px;color:var(--muted);font-size:.85rem;text-align:center}
.foot .btn{margin-top:10px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{font:inherit;background:none;border:0;color:var(--muted);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;cursor:pointer;position:relative;border-top:3px solid transparent}
.tab .e{font-size:1.3rem;line-height:1}
.tab.on{color:var(--ink);border-top-color:var(--ink)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--pink);color:#1E2B2A;font-size:.7rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* Toast, modal, stamp */
.toast{position:fixed;left:50%;bottom:calc(var(--mapbot) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:12px;z-index:40;width:max-content;max-width:min(92vw,520px);font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(10,20,18,.6);display:grid;place-items:center;z-index:50;padding:20px}
.sheet{background:var(--surface);border-radius:18px;padding:24px 22px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.logo{font-family:"Permanent Marker","Marker Felt",cursive;font-size:3rem;line-height:.95;display:inline-block;background:var(--sticker);color:var(--sticker-ink);padding:12px 18px 6px;transform:rotate(-4deg);box-shadow:2px 4px 0 rgba(0,0,0,.2);margin:6px 0 18px}
.sheet p{margin-top:8px}
.howto{text-align:left;padding-left:22px;margin:16px 0 20px;color:var(--muted);font-size:.95rem}
.howto li{margin-top:6px}
.reveal-box{font-size:84px;line-height:1.1;margin:10px 0}
.big-num{font-weight:800;font-size:2rem;color:var(--money);margin-top:8px}
.shake{animation:shake .45s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.stamp{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.stamp-in{display:flex;flex-direction:column;align-items:center;transform:rotate(-12deg);animation:stamp 1.7s ease-out forwards}
.st-word{font-family:"Permanent Marker","Marker Felt",cursive;font-size:4rem;color:var(--stamp);border:6px solid var(--stamp);border-radius:10px;padding:6px 22px 0;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.st-gain{margin-top:10px;font-weight:800;font-size:1.6rem;background:var(--sticker);color:var(--sticker-ink);padding:2px 12px;border-radius:4px}
.st-gain.neg{background:var(--loss);color:#fff}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.6);opacity:0}16%{transform:rotate(-12deg) scale(1);opacity:1}82%{opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* v5 additions */
.hud-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hgauges{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.88rem;color:var(--muted)}
.hgauges b{color:var(--ink);font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;font-size:.86rem;margin-top:6px}
.gauge b{text-align:right;font-variant-numeric:tabular-nums}
.gbar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.gbar i{display:block;height:100%;transition:width .4s}
.evcard{text-align:left}
.evcard.inline{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:16px;margin-top:10px;box-shadow:4px 4px 0 var(--sticker)}
.ev-who{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}
.ev-av{width:58px;height:58px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;font-size:32px}
.ev-who h2{font-size:1.2rem;line-height:1.2}
.ev-text{margin-top:12px;font-size:1.02rem;line-height:1.5}
.ev-ch{display:grid;gap:8px;margin-top:14px}
.ev-btn{text-align:left}
.ev-cost{opacity:.75;font-weight:600}
.fxchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.jentry .fxchips{justify-content:flex-start}
.fxchip{font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--money) 16%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--money) 40%,transparent)}
.fxchip.neg{background:color-mix(in srgb,var(--loss) 14%,var(--surface));border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.herocard{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero-av{width:72px;height:72px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;font-size:40px;border:3px solid var(--ink)}
.herocard h2{font-size:1.3rem}
.jentry{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.j-who{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:24px}
.jentry h3{font-size:1rem;margin-top:2px}
.j-choice{font-weight:700;margin:4px 0;font-size:.9rem}
.j-choice::before{content:"→ "}
.review{padding:10px 0;border-top:1px solid var(--line)}
.review:first-child{border-top:0;padding-top:0}
.review p{margin-top:2px}
.review-mini{margin-top:10px;font-size:.88rem;background:var(--surface2);border-radius:10px;padding:8px 10px}
.st-good{color:var(--money)} .st-bad{color:var(--loss)} .st-mid{color:#B8860B}
.hero-form{text-align:left;margin-top:14px}
.hero-form label{font-weight:700;font-size:.9rem}
#heroname{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);margin-top:6px}
#heroname:focus{border-color:var(--ink);outline:none}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.av{font-size:1.5rem;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;padding:0}
.av.on{border-color:var(--ink);background:var(--sticker)}
.seg{grid-auto-flow:column}
.seg button{font-size:.82rem;padding:8px 4px}
@media (max-width:380px){.gauge{grid-template-columns:96px 1fr 28px}}

/* v6 additions */
.qtrack{position:absolute;left:10px;top:10px;right:64px;z-index:6;max-width:360px}
.qt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;background:rgba(255,255,255,.95);color:#1E2B2A;border-radius:14px;padding:8px 10px;box-shadow:0 3px 10px rgba(0,0,0,.2);font-size:.82rem;line-height:1.3;border:0;text-align:left;width:100%;font-family:inherit}
.qt .hint{color:#566663}
.qt-ic{font-size:1.4rem;text-align:center}
.qt-bar{display:block;height:7px;border-radius:4px;background:#E2E8E5;overflow:hidden;margin:5px 0 3px}
.qt-bar i{display:block;height:100%;background:#17834A;border-radius:4px;transition:width .4s}
.qt.done{grid-template-columns:30px 1fr auto;background:#17834A;color:#fff;cursor:pointer;animation:qtpulse 1.1s ease-in-out infinite}
.qt.done b{display:block;font-size:.95rem}
.qt-r{font-weight:800;text-align:right;background:#F7E733;color:#1E2B2A;border-radius:10px;padding:5px 8px;font-size:.8rem}
@keyframes qtpulse{0%,100%{box-shadow:0 0 0 0 rgba(23,131,74,.6)}50%{box-shadow:0 0 0 10px rgba(23,131,74,0)}}
.mq{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mq:first-child{border-top:0;padding-top:0}
.mq .qt-bar{background:var(--surface2)}
.mq.done span{font-weight:700}
.crdots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.crdots i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.crdots i.on{background:var(--ink)}
.agebig{font-weight:800;font-size:2.4rem;margin:8px 0}
#agein{margin:6px 0 10px}
.crlist{display:grid;gap:8px;margin-top:12px;text-align:left}
.crcard{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;font:inherit;text-align:left;background:var(--surface2);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer}
.crcard.on{border-color:var(--ink);background:color-mix(in srgb,var(--sticker) 35%,var(--surface))}
.crcard strong{display:block}
.crcard .hint{display:block;margin-top:2px}
.cre{font-size:1.8rem;text-align:center}
.crfx{display:block;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--money)}
.crnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.crnav .btn{flex:1}
.evcat{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface2);margin-bottom:8px}
.verdict{font-weight:800;font-size:1.15rem;padding:8px 14px;border-radius:12px;display:inline-block}
.verdict.good{background:#DFF3E7;color:#17834A}.verdict.bad{background:#FBE1DE;color:#C2362B}.verdict.mid{background:var(--surface2);color:var(--muted)}
.vdelay{opacity:0;animation:fadein .4s 1.6s forwards}
@keyframes fadein{to{opacity:1}}
.cashdelta{font-weight:800;font-size:1.8rem;color:var(--money);margin-top:8px}
.cashdelta.neg{color:var(--loss)}
.deltas{display:grid;gap:8px;margin-top:12px;text-align:left}
.drow{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.85rem}
.drow b{text-align:right;font-variant-numeric:tabular-nums}.drow b.pos{color:var(--money)}.drow b.neg{color:var(--loss)}
.dbar{position:relative;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.dbar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.dfrom{background:var(--line)}
.dto{background:var(--money);transition:width .9s cubic-bezier(.3,1.3,.6,1)}
.dto.neg{background:var(--loss);opacity:.85}
.follow{margin-top:12px;font-weight:700;color:var(--pink)}
.suspense{padding:20px 0}
.dots{font-size:2.6rem;font-weight:800;letter-spacing:6px}
.dots span{animation:blink 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.chip.onchip{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.famrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.famrow:first-child{border-top:0;padding-top:0}
.fam-av{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:26px;flex:none}
.elec{display:grid;gap:10px;margin-top:14px;text-align:left}
.erow{display:grid;grid-template-columns:120px 1fr 56px;gap:8px;align-items:center;font-size:.88rem}
.ebar{height:16px;border-radius:8px;background:var(--surface2);overflow:hidden}
.ebar i{display:block;height:100%;width:0;transition:width 1.4s cubic-bezier(.3,1,.4,1)}
.eme{background:#F7C82F}.eop{background:#9AA3AD}
.vdelay{margin-top:14px}

/* v7 additions */
.speedb{padding:5px 9px}
.life{text-align:left}
.life-head{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.life-av{width:56px;height:56px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;font-size:32px}
.life-head h2{font-size:1.2rem}
.life-age{font-weight:800;font-size:2.2rem;line-height:1;text-align:right}
.life-age small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.life-bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:12px 0 8px}
.life-bar i{display:block;height:100%;background:var(--pink);transition:width .6s}
.life-feed{max-height:42vh;overflow:auto;display:grid;gap:6px;padding:4px 2px;font-size:.92rem;scroll-behavior:smooth}
.life-feed p{animation:fadeup .4s ease-out;margin:0}
.life-feed b{display:inline-block;min-width:44px;color:var(--muted);font-size:.8rem}
.life-feed .coh-line{color:var(--muted);font-size:.85rem}
.life-feed .ch-line{font-weight:700}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.life-dec{margin-top:12px;border:2px solid var(--ink);border-radius:14px;padding:12px;box-shadow:4px 4px 0 var(--sticker)}
.life-dec h3{font-size:1.02rem}
.epi{background:linear-gradient(180deg,var(--surface2),var(--surface));border:2px solid var(--ink);border-radius:18px;padding:18px 16px;margin-top:8px}
.epi-av{font-size:54px;line-height:1.1}
.epi h2{font-size:1.4rem;margin-top:2px}
.epi-small{font-size:.82rem;color:var(--muted)}
.epi-body{text-align:left;margin-top:12px;display:grid;gap:8px;font-size:.93rem}
.epi-rank{font-weight:700}
.epi-coh{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:3px}
.coh{border-top:1px solid var(--line);padding:8px 0}
.coh:first-child{border-top:0;padding-top:0}
.coh summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}
.coh summary::-webkit-details-marker{display:none}
.coh ul{margin:8px 0 0 54px;padding:0;list-style:none;display:grid;gap:3px;font-size:.86rem}
.coh ul b{display:inline-block;min-width:52px;color:var(--muted)}

/* v8 additions */
.tab{font-size:.68rem}
.mhead{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.mic{width:48px;height:48px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:28px}
.mprice{text-align:right}.mprice b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.pos{color:var(--money)}.neg{color:var(--loss)}
.mchart{width:100%;height:150px;display:block;margin-top:10px;background:var(--surface2);border-radius:10px}
.mrange{display:flex;flex-direction:column;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:-150px;height:150px;padding:4px 8px;pointer-events:none;position:relative}
.mbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mbtns .btn{padding:9px 4px;font-size:.84rem}
.mnews{padding:8px 0;border-top:1px solid var(--line);margin:0}.mnews:first-child{border-top:0;padding-top:0}

/* v9 additions */
.qrow{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.qstaff{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.qstaff .hint{flex:1 1 100%}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px}
.blk.done{border-color:#C9A227;background:color-mix(in srgb,#F2C94C 18%,var(--surface))}
.ordrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.88rem}
.ordrow span{min-width:84px}
.clubhero{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-top:14px;box-shadow:4px 4px 0 var(--sticker)}
.ch-ic{font-size:2rem}
.clubhero h2{font-size:1.25rem}
.form{display:flex;gap:4px;margin:8px 0}
.form span{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:.75rem;color:#fff}
.fW{background:#17834A}.fD{background:#9AA3AD}.fL{background:#C2362B}
.nextm{display:grid;gap:6px;margin-top:10px;background:var(--surface2);border-radius:12px;padding:10px}
.ltable{width:100%;border-collapse:collapse;font-size:.9rem}
.ltable td{padding:6px 4px;border-top:1px solid var(--line)}
.ltable tr:first-child td{border-top:0}
.ltable td:first-child{width:26px;color:var(--muted)}
.ltable td:last-child{text-align:right}
.ltable tr.up td:first-child{color:#17834A;font-weight:800}.ltable tr.dn td:first-child{color:#C2362B;font-weight:800}
.ltable tr.me{background:color-mix(in srgb,var(--sticker) 40%,transparent);font-weight:700}
.pl{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.pl:first-child{border-top:0}
.pl-p{min-width:96px;font-size:.8rem;color:var(--muted)}.pl-n{min-width:110px;flex:1}
.lmatch{text-align:left}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:8px 0}
.score b{font-size:.92rem}
.sc{font-weight:800;font-size:2.4rem;font-variant-numeric:tabular-nums}
.lm-feed{display:grid;gap:5px;margin-top:10px;font-size:.9rem;max-height:34vh;overflow:auto}
.lm-feed p{margin:0;animation:fadeup .3s ease-out}
.lm-feed b{display:inline-block;min-width:34px;color:var(--muted)}
.lm-g{font-weight:800;color:#17834A}.lm-b{color:#C2362B}
.matchbtn{position:absolute;left:12px;bottom:14px;z-index:7;border:0;border-radius:14px;padding:12px 16px;background:#FF5FA2;color:#1E2B2A;font:inherit;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;animation:qtpulse 1.2s infinite}
.dists{display:grid;gap:8px;margin-top:10px}
.dist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px}
/* AGENT META */
/* Palettes des thèmes (data-skin sur :root) : générées depuis META_ITEMS par le bloc AGENT SKINS (style#sk-theme-css), clair et sombre. */
/* ===== SKINS : vitrine, aperçus, décos de carte, effets ===== */
:root{--rar-c:#6F7F7B;--rar-r:#2A73D9;--rar-e:#8E44D6;--rar-l:#C98712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rar-c:#A3B2AE;--rar-r:#73AEFF;--rar-e:#C597FF;--rar-l:#F4C55A}}
:root[data-theme="dark"]{--rar-c:#A3B2AE;--rar-r:#73AEFF;--rar-e:#C597FF;--rar-l:#F4C55A}
:root[data-av] .hero-av{background:var(--av-bg);border-color:var(--av-ring)}
.sheet:has(.meta-shop){max-width:760px}
.sk-top{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.sk-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.86rem;color:var(--ink)}
.sk-pill.jt{background:var(--sticker);color:var(--sticker-ink);border-color:transparent}
.sk-tok{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4B8 0 18%,#F6C945 45%,#D99A1E 80%);box-shadow:inset 0 0 0 1.5px #B87A12}
.meta-seg .sk-c{display:block;font-size:.68rem;font-weight:600;opacity:.75;margin-top:1px}
.sk-earn{margin:6px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
.sk-filt{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.sk-filt button{font:inherit;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:34px}
.sk-filt button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin-top:10px}
.sk-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.88rem;padding:18px 0}
.sk-card{--rc:var(--rar-c);position:relative;background:var(--surface2);border-radius:14px;padding:7px 7px 9px;display:flex;flex-direction:column;gap:3px;border:2px solid transparent;text-align:left;min-width:0}
.sk-card.r-r{--rc:var(--rar-r)}.sk-card.r-e{--rc:var(--rar-e)}.sk-card.r-l{--rc:var(--rar-l)}
.sk-card.r-e{border-color:color-mix(in srgb,var(--rar-e) 35%,transparent)}
.sk-card.r-l{background:linear-gradient(var(--surface2),var(--surface2)) padding-box,linear-gradient(135deg,#F6D365,#E9894A 50%,#F6D365) border-box}
.sk-card.on{box-shadow:0 0 0 2.5px var(--ink);background:var(--surface)}
.sk-card.r-l.on{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#F6D365,#E9894A 50%,#F6D365) border-box}
.sk-pv{position:relative;height:92px;border-radius:9px;overflow:hidden;display:grid;place-items:center;margin-bottom:5px;isolation:isolate}
.sk-lock{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(15,22,26,.62);display:grid;place-items:center;z-index:3}
.sk-lock svg{width:11px;height:11px}
.sk-new{position:absolute;left:5px;top:5px;background:var(--pink);color:#1E2B2A;font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:999px;z-index:3;letter-spacing:.02em}
.sk-rar{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--rc);display:flex;align-items:center;gap:5px}
.sk-rar::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--rc);transform:rotate(45deg)}
.sk-n{font-size:.92rem;line-height:1.2;color:var(--ink)}
.sk-how{font-size:.74rem;color:var(--muted);line-height:1.3}
.sk-bar{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sk-bar i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.sk-bar i b{display:block;height:100%;background:var(--rc);border-radius:3px}
.sk-bt{display:flex;gap:5px;margin-top:auto;padding-top:6px}
.sk-bt .btn{flex:1;padding:7px 6px;font-size:.8rem;min-height:36px;border-radius:9px;white-space:nowrap}
.sk-bt .btn.go{background:var(--ink);color:var(--surface)}
.sk-bt .btn.ghost{border-width:1.5px}
.sk-bt .btn.buy{background:var(--sticker);color:var(--sticker-ink);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.sk-bt .btn.soon{background:transparent;color:var(--muted);border:1.5px dashed var(--line)}
.sk-pass{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}.sk-pass .sk-pv{height:72px;margin:0;border:2px solid rgba(255,255,255,.7)}.sk-pass .sk-av{width:44px;height:44px;font-size:24px}.sk-pass .sk-pv.cl>svg{width:50px;height:50px}
.sk-eq{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.8rem;font-weight:800;border-radius:9px;min-height:36px;background:color-mix(in srgb,var(--money) 15%,transparent);color:var(--money)}
/* aperçu thème : mini écran clair | sombre */
.sk-th{display:grid;grid-template-columns:1fr 1fr;place-items:stretch}
.sk-mk{background:var(--b);padding:8px 7px;display:flex;flex-direction:column;gap:5px;min-width:0}
.sk-mk>.a{display:flex;gap:4px;align-items:center;justify-content:space-between}
.sk-mk .c{height:7px;width:46%;border-radius:3px;background:var(--i)}
.sk-mk .k{height:10px;width:32%;border-radius:5px;background:var(--k)}
.sk-mk .s{flex:1;background:var(--s);border:1px solid var(--l);border-radius:7px;padding:6px 5px;display:flex;flex-direction:column;gap:4px}
.sk-mk .t{height:5px;border-radius:3px;background:var(--i);width:72%}
.sk-mk .u{height:4px;border-radius:2px;background:var(--m);width:52%}
.sk-mk .p{height:11px;border-radius:5px;background:var(--p);width:58%;margin-top:auto}
.sk-mk .d{display:flex;gap:3px}.sk-mk .d i{width:9px;height:9px;border-radius:50%;background:var(--s2);border:1px solid var(--l)}
/* aperçu tenue */
.sk-av{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:36px;line-height:1;background:var(--g);border:3px solid var(--ring);box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.08)}
.sk-pv.av{background:var(--pvb)}
.sk-pv.av::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 1.2px,transparent 1.6px) 0 0/12px 12px;z-index:-1}
/* aperçu club */
.sk-pv.cl{background:repeating-linear-gradient(90deg,#3F9A4F 0 18px,#48A858 18px 36px)}
.sk-pv.cl>svg{width:74px;height:74px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
/* aperçu déco + déco sur la carte */
.sk-pv.dc{background:var(--sky)}
.sk-pv.dc .sk-house{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:84px;height:40px}
#meta-deco{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#meta-deco.night{background:linear-gradient(180deg,rgba(14,20,56,.42),rgba(14,20,56,.12) 55%,rgba(14,20,56,0))}
#meta-deco.dusk{background:linear-gradient(180deg,rgba(60,30,80,.22),rgba(60,30,80,0) 45%)}
.sk-gar{position:absolute;left:0;top:0;width:100%;}
#meta-deco .sk-gar{top:76px;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.22))}
.sk-cor{position:absolute;bottom:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.sk-cor.l{left:4px}.sk-cor.r{right:4px;transform:scaleX(-1)}
#meta-deco .sk-cor.bal{animation:skfloat 4.5s ease-in-out infinite}
#meta-deco .sk-cor.r.bal{animation-name:skfloatr}
@keyframes skfloat{50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes skfloatr{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-8px) rotate(-1.5deg)}}
.sk-tw{animation:sktw 1.8s ease-in-out infinite alternate}
@keyframes sktw{from{opacity:1}to{opacity:.35}}
.sk-mp{position:absolute;display:block}
#meta-deco .sk-mp{top:-6%;animation:skmapfall linear infinite}
#meta-deco .sk-mp>i{animation:sksway 2.4s ease-in-out infinite alternate}
@keyframes skmapfall{from{top:-6%}to{top:104%}}
@keyframes sksway{from{transform:translateX(-9px) rotate(-25deg)}to{transform:translateX(9px) rotate(35deg)}}
#meta-deco .sk-mp.fly{animation:skfly 7s ease-in-out infinite}
#meta-deco .sk-mp.fly>i{animation:skglow 2.2s ease-in-out infinite alternate}
@keyframes skfly{0%,100%{transform:translate(0,0)}33%{transform:translate(18px,-14px)}66%{transform:translate(-12px,10px)}}
@keyframes skglow{from{opacity:.25}to{opacity:1}}
#meta-deco .sk-mp.shoot{opacity:0;animation:skshoot 6s linear infinite}
#meta-deco .sk-mp.shoot>i{animation:none}
@keyframes skshoot{0%{transform:translate(0,0) rotate(-28deg);opacity:0}3%{opacity:1}16%{transform:translate(-220px,116px) rotate(-28deg);opacity:0}100%{transform:translate(-220px,116px) rotate(-28deg);opacity:0}}
/* particules (aperçus, carte, pluie) */
.px{display:block;width:var(--z,14px);height:var(--z,14px)}
.px-coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C4 0 16%,#F6C945 42%,#D99A1E 78%);box-shadow:inset 0 0 0 1.5px #B4760E,inset 0 0 0 3.5px #F7D766}
.px-bill{width:calc(var(--z,14px)*1.75);border-radius:2px;background:radial-gradient(circle,#2F8A50 0 20%,transparent 23%),linear-gradient(#8FDCA8,#6CC48C);box-shadow:inset 0 0 0 1.5px #2F8A50}
.px-conf{width:calc(var(--z,14px)*.45);border-radius:1.5px;background:var(--c,#FF5FA2)}
.px-dia{clip-path:polygon(50% 0,100% 36%,50% 100%,0 36%);background:linear-gradient(135deg,#F1FDFF,#8BE6F7 40%,#25AFD6 70%,#C9F7FF)}
.px-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(#FFF3B0,#F5BE2E)}
.px-heart{background:var(--c,#FF6F91);clip-path:path('M7 13 C7 13 0 8.5 0 4.2 C0 1.8 1.8 0 4 0 C5.3 0 6.4 .7 7 1.7 C7.6 .7 8.7 0 10 0 C12.2 0 14 1.8 14 4.2 C14 8.5 7 13 7 13 Z');width:14px;height:13px}
.px-petal{border-radius:80% 0 80% 0;background:linear-gradient(135deg,#FFE3EC,var(--c,#FFA8C5))}
.px-leaf{border-radius:0 80% 0 80%;background:linear-gradient(135deg,var(--c,#F2994A),color-mix(in srgb,var(--c,#F2994A) 70%,#5A2A0A));box-shadow:inset -1px 1px 0 rgba(255,255,255,.25)}
.px-bar{width:calc(var(--z,14px)*1.8);height:calc(var(--z,14px)*.8);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);background:linear-gradient(#FFEFA6,#EDB52E 55%,#B87A10)}
.px-bub{border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.9) 0 12%,rgba(180,230,255,.3) 38%,rgba(120,200,255,.12))}
.px-snow{border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(255,255,255,.8);opacity:.92}
.px-fly{border-radius:50%;background:#F7F06A;box-shadow:0 0 0 1px rgba(110,100,0,.35),0 0 8px 4px rgba(255,226,90,.8),0 0 18px 8px rgba(255,236,120,.35)}
.px-shoot{width:80px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FFE58A,rgba(255,213,74,0));position:relative}
.px-shoot::before{content:"";position:absolute;left:-6px;top:-5px;width:13px;height:13px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#FFD54A}
.px-spark{width:7px;height:7px;border-radius:50%;background:var(--c,#FFD54A);box-shadow:0 0 6px 1px var(--c,#FFD54A)}
.sk-pv .px{position:absolute}
.sk-pv.fx{background:radial-gradient(circle at 50% 120%,#2E4652,#18242C 70%)}
/* pluie d'effets */
.meta-rain .pf{position:absolute;top:-40px;animation:skfall linear forwards}
.meta-rain .pf.up{top:auto;bottom:-40px;animation-name:skrise}
.meta-rain .pf>i{animation:skspin .9s linear infinite}
.meta-rain .pf>.px-coin{animation:skflip .7s linear infinite}
.meta-rain .pf>.px-bill{animation:skflut 1.1s ease-in-out infinite alternate}
.meta-rain .pf>.px-bub{animation:none}
.meta-rain .bst{position:absolute;width:0;height:0}
.meta-rain .bst>i{position:absolute;left:0;top:0;opacity:0;animation:skburst 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes skfall{to{transform:translate3d(var(--dx,0),calc(100vh + 80px),0) rotate(var(--rot,300deg))}}
@keyframes skrise{to{transform:translate3d(var(--dx,0),calc(-100vh - 80px),0)}}
@keyframes skspin{to{transform:rotate3d(1,.6,.2,360deg)}}
@keyframes skflip{50%{transform:scaleX(.12)}}
@keyframes skflut{from{transform:rotate(-24deg) skewX(-10deg)}to{transform:rotate(26deg) skewX(10deg)}}
@keyframes skburst{0%{transform:translate(0,0) scale(1.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(.35);opacity:0}}
@media (prefers-reduced-motion: reduce){#meta-deco *{animation:none!important}.meta-rain .pf>i{animation:none}}

/* AGENT GRAPHISME */
.gfx-open{width:100%;margin-top:14px}
.gfx-sheet{max-width:460px;padding:20px 14px;text-align:left}
.gfx-sheet h2,.gfx-sheet>p{padding:0 6px}
.gfx-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 8px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gfx-row::-webkit-scrollbar{display:none}
.gfx-card{flex:0 0 86%;scroll-snap-align:center;background:var(--surface2);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.gfx-card.cur{border-color:var(--ink)}
.gfx-card.next{border-color:var(--sticker)}
.gfx-pic{position:relative;aspect-ratio:16/10;background:linear-gradient(#9FD3EF,#E2F2F8);overflow:hidden}
.gfx-pic canvas{width:100%;height:100%;display:block;opacity:0;transition:opacity .4s}
.gfx-pic canvas.ok{opacity:1}
.gfx-card.lock .gfx-pic canvas{filter:blur(2.5px) saturate(.75)}
.gfx-card.next .gfx-pic canvas{filter:blur(1px)}
.gfx-card.next .gfx-lock{left:10px;top:auto;bottom:10px;transform:none;width:40px;height:40px;font-size:22px}
.gfx-stamp{position:absolute;top:8px;right:8px;width:44px;height:52px;display:grid;place-items:center;font-size:24px;background:#fff;border:2px dashed var(--stamp);border-radius:4px;transform:rotate(6deg)}
.gfx-lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;background:rgba(255,255,255,.85);width:58px;height:58px;border-radius:50%;display:grid;place-items:center}
.gfx-body{padding:10px 12px 12px;font-size:.88rem}
.gfx-body h3{font-size:1.1rem;margin-top:2px}
.gfx-body p{margin-top:5px}
.gfx-st{font-size:.78rem;font-weight:700;color:var(--muted)}
.gfx-card.next .gfx-st{color:var(--ink)}
.gfx-biz{letter-spacing:2px}
.gfx-dots{display:flex;justify-content:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.gfx-dots button{font:inherit;font-size:.9rem;min-width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.gfx-dots button.cur{border-color:var(--ink);background:var(--sticker)}
.route .city{cursor:pointer}
#gfx-vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 75% 70% at 50% 45%,rgba(10,15,30,0) 55%,rgba(10,15,30,1) 140%)}

.obj-main .tagp{background:#1E2B2A;color:#F7E733;border-color:#1E2B2A}

.conq-list .ck{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;margin-top:2px}

.route{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}

.gfx-open{margin-top:6px}

/* Divers */
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-weight:700;font-size:.9rem;min-height:44px;display:flex;align-items:center}
.ui-gain{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);font-weight:800;font-size:1.3rem;color:var(--money);background:var(--surface);border:2px solid var(--money);border-radius:8px;padding:2px 10px;animation:uigain .85s ease-out forwards}

.hgauges span[title],.gfx-conq{cursor:pointer}
.gfx-conq{text-decoration:underline dotted;text-underline-offset:3px}
/* ===== DA UI : relief doux, rayons cohérents, alignements ===== */
:root{
  --r1:10px; --r2:14px; --r3:18px; --r4:24px;
  --edge:color-mix(in srgb,var(--line) 75%,transparent);
  --track:color-mix(in srgb,var(--ink) 11%,transparent);
  --sh1:0 1px 2px rgba(30,43,42,.06),0 4px 12px -6px rgba(30,43,42,.22);
  --sh2:0 2px 6px rgba(30,43,42,.08),0 18px 40px -14px rgba(30,43,42,.42);
  --press:rgba(0,0,0,.22);
  --go-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh1:0 1px 0 rgba(255,255,255,.04) inset,0 4px 14px -6px rgba(0,0,0,.7);--sh2:0 1px 0 rgba(255,255,255,.05) inset,0 20px 44px -12px rgba(0,0,0,.85);--press:rgba(0,0,0,.4);--track:color-mix(in srgb,var(--ink) 13%,transparent);--go-ink:#0B1F15}}
:root[data-theme="dark"]{--sh1:0 1px 0 rgba(255,255,255,.04) inset,0 4px 14px -6px rgba(0,0,0,.7);--sh2:0 1px 0 rgba(255,255,255,.05) inset,0 20px 44px -12px rgba(0,0,0,.85);--press:rgba(0,0,0,.4);--track:color-mix(in srgb,var(--ink) 13%,transparent);--go-ink:#0B1F15}
body{overflow-x:hidden;text-rendering:optimizeLegibility}
h2,h3{text-wrap:balance}
p,.hint,.sub{overflow-wrap:break-word}
.hint{line-height:1.4}

/* Boutons : relief tactile (bord inférieur), appui qui s'enfonce */
.btn{border-radius:12px;padding:11px 16px;font-weight:700;letter-spacing:.005em;box-shadow:inset 0 -3px 0 var(--press);transition:transform .08s ease-out,box-shadow .08s ease-out,filter .15s,background-color .15s;overflow-wrap:break-word;max-width:100%}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 -1px 0 var(--press)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 26%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ink) 9%,transparent)}
.btn.ghost:hover:not(:disabled){filter:none;border-color:var(--ink)}
.btn.small{border-radius:10px;padding:8px 12px;font-size:.86rem}
.btn.big{border-radius:var(--r2);padding:14px 18px;font-size:1.05rem}
.btn:disabled{opacity:.42;box-shadow:none;filter:saturate(.4)}
.btn.go{color:var(--go-ink)}
.btn.boost{box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.btn.boost.on{animation:boostglow 1.4s ease-in-out infinite}
@keyframes boostglow{50%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 0 0 5px color-mix(in srgb,var(--pink) 30%,transparent)}}
.btn.pinkb,.btn.claim{box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.bs-row,.actions,.mbtns,.qstaff{gap:8px}
.actions .btn,.bs-row .btn{flex:0 1 auto}
.qstaff .btn{flex:1 1 auto}

const OLD_KEYS=['flipEmpire_v8','flipEmpire_v7','flipEmpire_v6','flipEmpire_v5','flipEmpire_v4','flipEmpire_v3','flipEmpire_v2','flipEmpire_v1','flipEmpire'];
function fillDefaults(d,o){for(const k in d){if(o[k]===undefined||o[k]===null&&d[k]!==null)o[k]=d[k];else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))fillDefaults(d[k],o[k])}return o}
function repair(o){
  if(!o||typeof o!=='object')return null;
  fillDefaults(newGame(),o);
  if(!isFinite(o.cash)||o.cash<0)o.cash=0;
  o.share=Math.min(.5,Math.max(0,+o.share||0));
  o.stage=clamp(o.stage|0,0,STAGES.length-1);o.city=clamp(o.city|0,0,CITIES.length-1);o.gen=Math.max(1,o.gen|0);
  ['energy','rep'].forEach(k=>{if(!isFinite(o[k]))o[k]=50});
  return o;
}
function readKey(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function load(){
  let o=readKey(KEY)||readKey(KEY+'_bak');
  if(!o)for(const k of OLD_KEYS){o=readKey(k);if(o)break}
  return repair(o);
}
let saveFails=0;

function importSave(code){try{const o=repair(JSON.parse(decodeURIComponent(escape(atob(code.trim())))));if(!o||!o.biz)return false;S=o;save();return true}catch(e){return false}}

const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const START_YEAR=2026;
const monthOf=d=>(d-1)%12,yearOf=d=>START_YEAR+Math.floor((d-1)/12);
const dateLabel=d=>MONTHS[monthOf(d)]+' '+yearOf(d);
function dayEvent(d){
  const m=monthOf(d);const ce=S&&S.city&&CITY_EV[S.city];if(ce&&ce[m])return ce[m];
  if(m===11)return{m:2.5,n:'🎄 Fêtes ×2,5'};
  if(m===0||m===6)return{m:2,n:'🏷️ Soldes ×2'};
  if(m===8)return{m:1.3,n:'🎒 Rentrée ×1,3'};
  if(m===7)return{m:.8,n:'🏖️ Vacances ×0,8'};
  return null;
}

const openIds=()=>BIZ.filter(b=>S.biz[b.id].lvl>0).map(b=>b.id);
const rankIdx=()=>{let i=0;RANKS.forEach((r,k)=>{if(S.xp>=r[0])i=k});return i};
const globalUpg=()=>UPG.filter(u=>!u.biz&&S.upg.includes(u.id)).reduce((a,u)=>a*u.x,1);
const bizUpg=id=>UPG.filter(u=>u.biz===id&&S.upg.includes(u.id)).reduce((a,u)=>a*u.x,1);
const satOf=id=>{const q=S.biz[id].q;return (q.clean+q.wait+q.qual)/3};
const satMult=id=>.4+1.2*satOf(id)/100;
const avgSat=()=>{const o=openIds();return o.length?o.reduce((a,id)=>a+satOf(id),0)/o.length:75};
const trophyMult=()=>(1+.05*S.trophies.length)*(S.trophies.length>=TROPHIES.length?2:1);
function permMult(){return (.8+S.rep/250)*(1+.1*S.stars)*trophyMult()*(1+.05*rankIdx())*globalUpg()*STAGES[S.stage].mult*(1-Math.min(.5,Math.max(0,S.share||0)))*(S.energy<20?.8:1)*(S.flags.dimanche?1.15:1)*(S.hero.origin==='etranger'?1.05:1)*(S.sitBonus||1)*projMult()*(S.hero.passions&&S.hero.passions.includes('lecture')?1.03:1)}
const boosted=()=>Date.now()<S.boostUntil,frenzy=()=>Date.now()<S.frenzyUntil;
const tempMult=()=>{const ev=dayEvent(S.day);return (boosted()?2:1)*(frenzy()?5:1)*(ev?ev.m:1)};
const modMult=id=>S.mods.reduce((a,m)=>(S.day<=m.until&&(!m.biz||m.biz===id))?a*m.m:a,1);
const palierMult=l=>Math.pow(2,PALIERS.filter(p=>l>=p).length);
const nextPalier=l=>PALIERS.find(p=>l<p);
const baseRev=b=>b.base*S.biz[b.id].lvl*palierMult(S.biz[b.id].lvl)*bizUpg(b.id);
let nbCache={};
const nbMult=id=>1+(nbCache[id]||0);
const steadyRev=b=>baseRev(b)*permMult()*satMult(b.id)*modMult(b.id)*nbMult(b.id);
const revenue=b=>steadyRev(b)*tempMult();
const autoIncome=()=>BIZ.reduce((a,b)=>{const st=S.biz[b.id];return a+(st.lvl>0&&st.mgr?revenue(b)/b.time:0)},0);
const inc=()=>Math.max(3,BIZ.reduce((a,b)=>a+(S.biz[b.id].lvl?baseRev(b)*permMult()/b.time:0),0));
const costSec=sec=>Math.max(10,Math.round(inc()*sec));
const costN=(b,lvl,n)=>b.cost*Math.pow(b.m,lvl)*(Math.pow(b.m,n)-1)/(b.m-1);
function maxAff(b,lvl){const c=b.cost*Math.pow(b.m,lvl);if(S.cash<c)return 0;return Math.floor(Math.log(S.cash*(b.m-1)/c+1)/Math.log(b.m))}
function quote(b){
  const lvl=S.biz[b.id].lvl;
  if(lvl===0)return{n:1,cost:b.cost,ok:S.cash>=b.cost,label:`Débloquer pour ${fmt(b.cost)}`};
  const n=S.buyMode==='max'?Math.max(1,maxAff(b,lvl)):S.buyMode,cost=costN(b,lvl,n);
  return{n,cost,ok:S.cash>=cost,label:`Acheter ×${n} pour ${fmt(cost)}`};
}
function earn(x){S.cash+=x;S.lifetime+=x;S.lifetimeAll+=x}
function spend(x){S.cash-=x;if(dispCash>S.cash)dispCash=S.cash}
let newStars=()=>Math.max(0,Math.floor(Math.sqrt(S.lifetimeAll/1e6))-S.stars);

function genCohort(birthYear){
  const out=[];for(let i=0;i<3;i++){const c=wpick(COUNTRIES),name=pick(c.names),city=pick(c.cities);
    const early=Math.random()<.09*(1-c.dev);let death=early?randInt(0,4):clamp(Math.round(c.le+rand(-16,12)),18,104);
    const school=Math.random()<.25+c.dev*.7?(Math.random()<c.dev*.6?22:17):12;
    const jobs=school===12?JOBS_W[0]:school===17?JOBS_W[Math.random()<.7?1:0]:JOBS_W[Math.random()<.75?2:1];
    const tl=[{a:0,t:`Naît à ${city}, ${c.n}.`}];
    if(death>5)tl.push({a:6,t:school>=12?'Entre à l’école.':'N’a pas pu aller à l’école.'});
    if(death>school)tl.push({a:school,t:school===22?'Termine l’université.':school===17?'Quitte le lycée.':'Arrête l’école pour aider la famille.'});
    const ja=Math.max(14,school+1);if(death>ja)tl.push({a:ja,t:`${name} ${pick(jobs[1])}.`});
    const ma=randInt(18,32);if(death>ma&&Math.random()<.85)tl.push({a:ma,t:'Se marie.',big:1});
    const kids=Math.max(0,Math.round(rand(1,5.5)*(1.2-c.dev)));let ka=ma+1;for(let k=0;k<kids;k++){if(death>ka){tl.push({a:ka,t:`Devient parent pour la ${k?k+1+'e':'1re'} fois.`,big:1})}ka+=randInt(2,4)}
    if(Math.random()<.08&&death>28)tl.push({a:randInt(24,35),t:`Émigre vers ${pick(['l’Europe','le Canada','les Émirats','les États-Unis'])} pour une vie meilleure.`,big:1});
    if(death>62)tl.push({a:62,t:'Prend sa retraite.'});
    tl.push({a:death,t:death<5?'Meurt en bas âge.':`Meurt à ${death} ans.`,big:1,dead:1});
    tl.sort((x,y)=>x.a-y.a);out.push({name,c:c.n,f:c.f,city,death,tl,born:birthYear});}
  return out;
}

  if(n<=0){toast(room<=0?'Ton entrepôt est plein. Agrandis-le ou vends.':'Pas assez d’argent.');sfx('no');return}
  spend(n*p);M.avg=(M.avg*M.qty+p*n)/(M.qty+n);M.qty+=n;sfx('buy');
}
function mktSell(n){
  const M=S.mkt,p=M.price*.99;n=n==='max'?M.qty:Math.min(n,M.qty);if(n<=0){sfx('no');return}
  const gain=(p-M.avg)*n;earn(n*p);M.qty-=n;M.profit+=gain;if(!M.qty)M.avg=0;sfx(gain>=0?'sale':'bad');
  const [X,Y]=[innerWidth/2,innerHeight*.4];burstAt(X,Y,gain>0?8:0,(gain>=0?'+':'')+fmt(gain));
}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}return AC}
function tone(freqs,dur,type,vol){
  if(!S.sound)return;const a=ac();if(!a)return;if(a.state==='suspended')a.resume();
  const t=a.currentTime;
  freqs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,t+i*dur);g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur*2);
    o.connect(g);g.connect(a.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*2.2)});
}
const sfxT={};
function sfx(k){
  const n=performance.now(),gap={coin:110,tick:90,auto:350}[k]||0;
  if(gap&&n-(sfxT[k]||0)<gap)return;sfxT[k]=n;
  if(k==='coin')tone([988,1319],.05,'sine',.05);
  else if(k==='tick')tone([1568+Math.random()*300],.03,'sine',.025);
  else if(k==='auto')tone([1175],.04,'sine',.018);
  else if(k==='buy')tone([523,659,784],.05,'triangle',.06);
  else if(k==='sale')tone([784,988,1175,1568],.07,'triangle',.08);
  else if(k==='rank')tone([523,659,784,1047,1319],.09,'triangle',.08);
  else if(k==='vip')tone([1047,1319,1568,2093],.05,'square',.03);
  else if(k==='no')tone([220,165],.07,'square',.025);
  else if(k==='event')tone([659,880,659,988],.08,'triangle',.06);
  else if(k==='bad')tone([392,311],.12,'sawtooth',.03);
  else if(k==='good')tone([784,1047],.07,'sine',.05);
  else if(k==='tap')tone([660],.03,'triangle',.03);
}

const PTR=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);PTR.set(e.pointerId,[e.clientX,e.clientY]);if(PTR.size===1)drag={x:e.clientX,y:e.clientY,m:0};if(PTR.size===2){const v=[...PTR.values()];pinch={d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),z:cam.z};drag=null}});

  if(PTR.size===1&&drag){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];drag.m+=Math.abs(dx)+Math.abs(dy);cam.x-=dx/cam.z;cam.y-=dy/cam.z;cam.tx=cam.x;cam.ty=cam.y;clampCam();cam.x=cam.tx;cam.y=cam.ty}
  else if(PTR.size===2&&pinch){const v=[...PTR.values()];zoomTo(pinch.z*Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])/pinch.d)}});

function pip(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}
function tapAt(sx,sy){
  const p=toIso(sx,sy);
  if(!S.hintSeen){S.hintSeen=true;$('#maphint').hidden=true}
  for(const h of HITS_TOP){if(Math.hypot(p[0]-h.x,p[1]-h.y)<=h.r){
    if(h.kind==='bubble'){runBiz(h.id);sfx('tap')}
    else if(h.kind==='vip'&&vipEnt)catchVip(vipEnt);
    else if(h.kind==='event')showEvent();

  for(let i=HITS.length-1;i>=0;i--){if(pip(p,HITS[i].hex)){const h=HITS[i];sel=h.kind==='qg'?'qg':h.id;sfx('tap');renderSheet();const sh=$('#bsheet').getBoundingClientRect().height||0;cam.tx=h.top[0];cam.ty=h.top[1]+(sh/2)/cam.z;clampCam();return}}
  sel=null;renderSheet();
}

let lastTick=performance.now(),saveT=0,revT=8,trackT=0;
/* Pas de re-rendu sous le doigt : sinon le bouton visé disparaît entre l’appui et le relâchement */
let PDOWN=false,MAIN_LATE=false;
addEventListener('pointerdown',()=>{PDOWN=true},true);
const pUp=()=>{PDOWN=false;if(MAIN_LATE){MAIN_LATE=false;setTimeout(()=>{if(S.tab!=='ville'&&!modalOpen)renderMain()},60)}};
addEventListener('pointerup',pUp,true);addEventListener('pointercancel',pUp,true);
function tick(){
  const now=performance.now(),dt=Math.min((now-lastTick)/1000,3600);lastTick=now;
  if(!S.started||S.dead){updateLive();return}
  mktTick(dt);
  BIZ.forEach(b=>{
    const st=S.biz[b.id];if(st.lvl<1)return;
    if(st.mgr&&!st.running){st.running=true;st.prog=0}
    if(!st.running)return;
    st.prog+=dt/b.time;let got=0;const manual=!st.mgr;
    while(st.prog>=1){st.prog-=1;const r=revenue(b);earn(r);got+=r;S.counts.collect++;if(!st.mgr){st.running=false;st.prog=0;break}}
    if(got)onCollect(b,got,manual);
  });
  revT-=dt;if(revT<=0){revT=rand(10,20);const o=openIds();if(o.length&&Math.random()<.5)genReview(pick(o))}
  S.dayProg+=dt/DAY_SEC*(S.speed||1);
  if(S.dayProg>=1){
    newDay(true);renderHud();updateLive();layout();
    if(S.tab!=='ville'&&!modalOpen){if(PDOWN)MAIN_LATE=true;else renderMain()}
    renderSheet();
  }
  trackT-=dt;if(trackT<=0){trackT=.5;updateTracker()}
  updateLive();
  saveT+=dt;if(saveT>5){saveT=0;save()}
}

/* ---------- Buy mode "to next milestone" ---------- */
function quote(b){
  const lvl=S.biz[b.id].lvl;
  if(lvl===0)return{n:1,cost:b.cost,ok:S.cash>=b.cost,label:`Débloquer pour ${fmt(b.cost)}`};
  let n=S.buyMode==='max'?Math.max(1,maxAff(b,lvl)):S.buyMode==='next'?Math.max(1,(nextPalier(lvl)||lvl+1)-lvl):S.buyMode;

  return{n,cost,ok:S.cash>=cost,label:S.buyMode==='next'?`Jusqu’au palier ${lvl+n} pour ${fmt(cost)}`:`Acheter ×${n} pour ${fmt(cost)}`};
}

/* ---------- Real estate: blocks and rebuilding ---------- */
const BRANGE=[[0,3],[5,9],[11,15],[17,19]];
function blockIdOf(o){const tx=Math.floor(o.x+o.w/2),ty=Math.floor(o.y+o.d/2);const i=BRANGE.findIndex(r=>tx>=r[0]&&tx<=r[1]),j=BRANGE.findIndex(r=>ty>=r[0]&&ty<=r[1]);return i<0||j<0?null:'ABCD'[j]+(i+1)}
function blocks(){const m={};propsList().forEach(o=>{const id=blockIdOf(o);if(!id)return;(m[id]=m[id]||[]).push(o)});return m}
function blockDone(id){const l=blocks()[id];return l&&l.length>=2&&l.every(o=>S.props[o.pid])}
function blockMult(o){const id=blockIdOf(o);return id&&blockDone(id)?1.5:1}
function computeNb(){
  nbCache={};const owned=propsList().filter(o=>S.props[o.pid]);const bl=blocks(),done=Object.keys(bl).filter(blockDone);
  BIZ.forEach(b=>{const cx=b.p.x+b.p.w/2,cy=b.p.y+b.p.d/2;let n=0;owned.forEach(o=>{if(Math.max(Math.abs(o.x+o.w/2-cx),Math.abs(o.y+o.d/2-cy))<=3.5)n+=Math.min(S.props[o.pid],4)});
    let bonus=Math.min(.4,.04*n);done.forEach(id=>{if(bl[id].some(o=>Math.max(Math.abs(o.x+o.w/2-cx),Math.abs(o.y+o.d/2-cy))<=4))bonus+=.1});nbCache[b.id]=bonus});
}
function blockCost(id){const l=(blocks()[id]||[]).filter(o=>!S.props[o.pid]);let n=ownedCount(),t=0;l.forEach(o=>{t+=propBase(o)*Math.pow(1.1,n);n++});return Math.round(t*.9)}
function buyBlock(id){const l=(blocks()[id]||[]).filter(o=>!S.props[o.pid]);if(!l.length)return;const c=blockCost(id);if(S.cash<c){toast(`Il te manque ${fmt(c-S.cash)}.`);sfx('no');return}
  spend(c);l.forEach(o=>{S.props[o.pid]=1;S.counts.propsBought++});computeNb();addXP(10*l.length);sfx('rank');checkTrophies();
  toast(`🏘️ Îlot ${id} entièrement à toi : loyers ×1,5 et boutiques voisines +10 % !`)}
const rebuildCost=o=>Math.round(propBase(o)*8);
function rebuild(pid){const o=DECOR.find(x=>x.pid===pid);if(!o||S.props[pid]!==3)return;const c=rebuildCost(o);if(S.cash<c){toast(`Il te manque ${fmt(c-S.cash)}.`);sfx('no');return}
  spend(c);S.props[pid]=4;S.propUp[pid]=o.t==='apt'?4:3;computeNb();sfx('rank');addXP(15);
  const [X,Y]=worldToPage(o.x+o.w/2,o.y+o.d/2,(o.f+S.propUp[pid])*FH);burstAt(X,Y,6,'🏗️ Nouvelle résidence !');toast(`🏗️ Reconstruite en résidence moderne : loyer ×9 par rapport au départ.`)}
function vPatrimoine(){
  const all=propsList(),own=all.filter(o=>S.props[o.pid]),pct=all.length?Math.round(own.length/all.length*100):0,free=all.filter(o=>!S.props[o.pid]),bl=blocks();
  return `<div class="sec-head"><h2>Ton patrimoine</h2><p>${own.length}/${all.length} bâtiments<br>${pct} % de la ville</p></div>
  <div class="panel"><div class="kv"><span>Loyers par mois</span><b>${fmt(dailyRent())}</b></div><div class="kv"><span>Prochain achat à partir de</span><b>${free.length?fmt(Math.min(...free.map(propPrice))):'—'}</b></div>
  <p class="hint" style="margin-top:8px">Tes bâtiments ont un toit doré sur la carte. Rénove-les 3 fois, puis reconstruis-les en résidence moderne (plus haute, loyer ×9). Un îlot complet rapporte 50 % de loyers en plus et booste les boutiques voisines.</p></div>

  <div class="blocks">${Object.keys(bl).sort().map(id=>{const l=bl[id],n=l.filter(o=>S.props[o.pid]).length,done=blockDone(id);return `<div class="blk ${done?'done':''}"><b>Îlot ${id}</b><span class="hint">${n}/${l.length} à toi</span><div class="qt-bar"><i style="width:${n/l.length*100}%"></i></div>${done?'<span class="done">✓ Complet</span>':`<button class="btn small go" data-a="buyblock" data-id="${id}" data-cost="${blockCost(id)}" ${S.cash>=blockCost(id)?'':'disabled'}>Tout acheter ${fmt(blockCost(id))}</button>`}</div>`}).join('')}</div>
  ${own.length?`<div class="sec-head"><h2>Tes bâtiments</h2></div><div class="panel"><ul class="ug">${own.map(o=>{const l=S.props[o.pid];return `<li><div><strong>${propName(o)} ${l>=4?'🏗️':'★'.repeat(l-1)}</strong><span class="hint">Loyer ${fmt(propRent(o,l))} par mois${blockMult(o)>1?' · îlot complet':''}</span></div>${l<3?`<button class="btn small go" data-a="renov" data-id="${o.pid}" data-cost="${renovCost(o,l)}" ${S.cash>=renovCost(o,l)?'':'disabled'}>🔨 ${fmt(renovCost(o,l))}</button>`:l===3?`<button class="btn small go" data-a="rebuild" data-id="${o.pid}" data-cost="${rebuildCost(o)}" ${S.cash>=rebuildCost(o)?'':'disabled'}>🏗️ Reconstruire ${fmt(rebuildCost(o))}</button>`:'<span class="done">Résidence</span>'}</li>`}).join('')}</ul></div>`:''}`;

/* ---------- Market: three assets, take-profit and stop-loss ---------- */
const COIN={e:'🪙',n:'FlipCoin',u:'jeton',p:50,vol:.08,mul:200,news:[['Un milliardaire tweete son amour pour FlipCoin','Une grande banque accepte enfin FlipCoin'],['Une plateforme d’échange se fait pirater','Le gouvernement veut encadrer les cryptos']]};
const INDEXA={e:'🏙️',n:'Indice de la ville',u:'part',p:1000,vol:.012,mul:20,news:[['L’économie locale tourne à plein régime','Le chômage recule en ville'],['Une récession est annoncée','Un gros employeur ferme son usine']]};
let assetDef=i=>i===0?Object.assign({mul:1},mkt()):i===1?COIN:INDEXA;
function freshMkt(){const a=[0,1,2].map(i=>{const d=assetDef(i);return{qty:0,avg:0,price:d.p,target:d.p,hist:[d.p],tp:0,sl:0}});return{a,sel:0,cap:0,profit:0,news:[],nextNews:35,histT:0}}
const assetCap=i=>20*Math.pow(5,S.mkt.cap)*assetDef(i).mul;
function mktTick(dt){
  const M=S.mkt;if(!M||!M.a)return;
  M.a.forEach((A,i)=>{const d=assetDef(i);let lp=Math.log(A.price);lp+=.035*(Math.log(A.target)-lp)*dt+d.vol*gauss()*Math.sqrt(dt)*.6;A.price=clamp(Math.exp(lp),d.p*.1,d.p*12);
    if(A.qty){const r=A.price*.99/A.avg-1;if(A.tp&&r>=A.tp/100){const s=M.sel;M.sel=i;mktSell('max');M.sel=s;toast(`🎯 Ordre exécuté : ${d.e} ${d.n} vendu avec +${Math.round(r*100)} %.`)}
      else if(A.sl&&r<=-A.sl/100){const s=M.sel;M.sel=i;mktSell('max');M.sel=s;toast(`🛑 Stop-loss : ${d.e} ${d.n} vendu à ${Math.round(r*100)} %.`)}}});
  M.histT+=dt;if(M.histT>=1){M.histT=0;M.a.forEach(A=>{A.hist.push(A.price);if(A.hist.length>150)A.hist.shift()})}
  M.nextNews-=dt;
  if(M.nextNews<=0){M.nextNews=rand(35,80);const i=randInt(0,M.a.length-1),d=assetDef(i),A=M.a[i];
    let up=Math.random()<.5;if(i===2)up=Math.random()<.45+(avgSat()-60)/200+conqDone()*.03;
    const txt=pick(d.news[up?0:1]);A.target=clamp(A.target*(up?rand(1.25,1.8):rand(.5,.8)),d.p*.25,d.p*6);
    if(i!==2&&Math.random()<.25)A.target=d.p*Math.exp(gauss()*.2);
    M.news.unshift({t:`${d.e} ${txt}`,up,day:S.day});if(M.news.length>8)M.news.length=8;
    if(S.started)toast(`📰 ${d.e} ${txt}`);
  }
}
function mktBuy(n){
  const M=S.mkt,A=M.a[M.sel],p=A.price*1.01,room=assetCap(M.sel)-A.qty;n=n==='max'?Math.min(room,Math.floor(S.cash/p)):Math.min(n,room,Math.floor(S.cash/p));
  if(n<=0){toast(room<=0?'Plafond atteint pour cet actif. Agrandis ton portefeuille.':'Pas assez d’argent.');sfx('no');return}
  spend(n*p);A.avg=(A.avg*A.qty+p*n)/(A.qty+n);A.qty+=n;sfx('buy');
}
function mktSell(n){
  const M=S.mkt,A=M.a[M.sel],p=A.price*.99;n=n==='max'?A.qty:Math.min(n,A.qty);if(n<=0){sfx('no');return}
  const gain=(p-A.avg)*n;S.cash+=n*p;if(gain>0){S.lifetime+=gain;S.lifetimeAll+=gain}A.qty-=n;M.profit+=gain;if(!A.qty)A.avg=0;sfx(gain>=0?'sale':'bad');

function autoScore(){const C=S.club,me=clubStr2()+(C.match.home?3:0),op=C.match.oppStr;let gf=0,ga=0;for(let t=0;t<30;t++){if(Math.random()<.045*Math.exp((me-op)/25))gf++;if(Math.random()<.045*Math.exp((op-me)/25))ga++}return [gf,ga]}

  const C=S.club,M=C.match;if(!M||M.done)return;M.done=true;M.gf=gf;M.ga=ga;const res=gf>ga?'W':gf===ga?'D':'L';

  {id:'fete',e:'🎆',n:'Une grande fête annuelle',th:'commerce',proj:'fete'},{id:'stadep',e:'🏟️',n:'Rénover le stade',th:'sport',proj:'stadep'}];

  {id:'supporters',e:'⚽',n:'Les supporters du club',req:()=>S.club.own,reqT:'posséder le club de foot',fx:{sud:10,nord:3}},
  {id:'asso',e:'🤝',n:'Les associations de quartier',cost:120,req:()=>true,reqT:'un don',fx:{nord:9}},

function initCampaign(){const P=S.pol,th=Object.keys(CONCERNS);P.cand=true;P.dist={};DISTRICTS.forEach(d=>P.dist[d.id]={pop:clamp(Math.round(S.rep*.45+rand(-6,6)),5,90),con:pick(th)});P.prom=[];P.endo=[];P.acts={};P.poll=false;P.opp=P.opp||pick(OPP);}
function campAct(k,d){
  const P=S.pol;if(!P.cand)return;const key=k+(d||'');if(P.acts[key])return;
  const cost={meeting:60,affiches:100,sondage:40}[k]||0,ne={meeting:10,porte:16}[k]||0,c=cost?costSec(cost):0;
  if(S.cash<c){toast(`Il te manque ${fmt(c-S.cash)}.`);sfx('no');return}if(S.energy<ne){toast('Trop fatigué pour faire campagne ce mois-ci.');sfx('no');return}
  spend(c);S.energy=clamp(S.energy-ne,0,100);P.acts[key]=1;
  const D=DISTRICTS.find(x=>x.id===d);
  if(k==='meeting'){const g=randInt(5,9);P.dist[d].pop=clamp(P.dist[d].pop+g,0,100);toast(`🗣️ Salle comble ${D.e} ${D.n} : +${g} points.`)}
  if(k==='porte'){const g=randInt(6,11);P.dist[d].pop=clamp(P.dist[d].pop+g,0,100);toast(`🚪 Des centaines de portes ${D.e} ${D.n} : +${g} points.`)}
  if(k==='affiches'){DISTRICTS.forEach(x=>P.dist[x.id].pop=clamp(P.dist[x.id].pop+randInt(2,4),0,100));toast('📰 Ton visage est partout en ville : +3 points partout.')}
  if(k==='sondage'){P.poll=true;toast('📊 Sondage reçu : chiffres exacts et préoccupations de chaque quartier dévoilés.')}
  sfx('good');
}
function endorse(id){const P=S.pol,e=ENDORSE.find(x=>x.id===id);if(!P.cand||P.endo.includes(id)||!e.req())return;if(e.cost){const c=costSec(e.cost);if(S.cash<c){sfx('no');return}spend(c)}
  P.endo.push(id);Object.entries(e.fx).forEach(([d,v])=>P.dist[d].pop=clamp(P.dist[d].pop+v,0,100));sfx('rank');toast(`🤝 ${e.n} te soutiennent !`)}
function setPromise(id){const P=S.pol;if(!P.cand)return;if(P.prom.includes(id))P.prom=P.prom.filter(x=>x!==id);else if(P.prom.length<3)P.prom.push(id);else{toast('Trois promesses maximum.');sfx('no')}}
function distScore(d){const P=S.pol,x=P.dist[d.id],match=P.prom.some(id=>PROMISES.find(p=>p.id===id).th===x.con)?7:0,kept=P.office?P.kept||0:0,broken=P.office?P.broken||0:0;return x.pop*.6+S.rep*.2+avgSat()*.08+match+kept*5-broken*7}
function election(){
  const P=S.pol,oppName=P.opp||OPP[0];let tot=0;const res=DISTRICTS.map(d=>{const me=Math.max(5,distScore(d)+rand(-6,6)),op=Math.max(5,42+rand(-8,8)+S.city);const pct=Math.round(me/(me+op)*1000)/10;tot+=pct*d.w;return{d,pct}});

  else{if(P.office)P.office=null;S.rep=clamp(S.rep-3,0,100)}

  queueModal(`<div class="reveal-box">🗳️</div><h2>Soirée électorale</h2><p class="hint">Résultats quartier par quartier…</p>
    <div class="elec">${res.map(r=>`<div class="erow"><span>${r.d.e} ${r.d.n}</span><div class="ebar"><i class="${r.pct>50?'eme':'eop'}" data-w="${r.pct}"></i></div><b>${r.pct} %</b></div>`).join('')}</div>
    <div class="cashdelta ${win?'':'neg'}" style="margin-top:10px">${tot} %</div>
    <div class="verdict ${win?'good':'bad'} vdelay">${win?'🎉 Tu es '+gx(S.hero,'élu','élue')+' maire de '+(S.city?CITIES[S.city].n:'ta ville')+' ! Tiens tes promesses.':'😔 '+gx(S.hero,'Battu','Battue')+' cette fois. Prochaine élection dans 2 ans.'}</div>
    <button class="btn big" style="margin-top:16px" data-a="close">Continuer</button>`);
  setTimeout(()=>document.querySelectorAll('.ebar i').forEach(e=>e.style.width=e.dataset.w+'%'),300);sfx(win?'rank':'bad');

const ECO_ACAD=[{n:'Aucun',c:0},{n:'Petit',c:40000},{n:'Réputé',c:400000},{n:'Élite',c:4e6}];
const ECO_TIX=[{n:'Populaire',p:.6,d:1.2,f:1.03},{n:'Normal',p:1,d:1,f:1},{n:'Élevé',p:1.5,d:.78,f:.99},{n:'Premium',p:2.4,d:.52,f:.97}];
const ECO_TIXB=[5,7,10,14,20,30],ECO_BUV=[2,2.5,3,4,5,6],ECO_TV=[0,200,1500,12000,120000,900000],ECO_DIVW=[1,1.7,3.2,7,15,34];
const ECO_KITS=[['#D7263D','#FFFFFF'],['#1F4E9E','#F7E733'],['#17834A','#FFFFFF'],['#6A1B9A','#F7C82F'],['#1E2B2A','#E53935'],['#F57C00','#1E2B2A'],['#00A3E0','#FFFFFF']];
const ECO_SPONS=['Boulangerie du Coin','Garage du Centre','Pizzeria Bella','Assurances Horizon','BTP Durand','Banque Régionale','Opérateur Flash','Air Azur','Énergies Nova','Géant de la Tech'];
function ecoHash(s){let h=7;for(const ch of String(s||'x'))h=(h*31+ch.charCodeAt(0))>>>0;return h}
function ecoM(){return CITY_MULT(S.city||0)}
function ecoPM(){return 1/(S.speed||1)}
function ecoC(){const C=S.club;
  if(C.own){
    if(!Array.isArray(C.squad)||!C.squad.length){const base=clamp(Math.round(C.str||30),15,90);
      C.squad=POSTES.map(p=>({poste:p,name:pick(PNAMES),note:clamp(base+randInt(-3,3),10,99),fit:70,inj:0}))}
    if(!Array.isArray(C.table)||!C.table.some(t=>t&&t.me)){C.table=genTable(clamp(C.div|0,0,DIVS.length-1));C.table[0].n=C.name}
    if(!Array.isArray(C.seasons))C.seasons=[];if(!Array.isArray(C.form))C.form=[];if(C.morale==null)C.morale=55;
  }
  if(!C.ecoV){C.ecoV=1;if(C.own){C.stade=[0,2,4,6][clamp(C.stade|0,0,3)];C.coach=[0,2,3,5][clamp(C.coach|0,0,3)]}}
  if(C.tix==null)C.tix=1;C.shop=C.shop||0;C.med=C.med||0;C.acad=C.acad||0;C.signs=C.signs||0;C.seasonRev=C.seasonRev||0;
  if(C.kit==null)C.kit=ecoHash(C.name)%ECO_KITS.length;
  C.stade=clamp(C.stade|0,0,ECO_ST.length-1);C.coach=clamp(C.coach|0,0,ECO_CO.length-1);C.div=clamp(C.div|0,0,DIVS.length-1);
  (C.squad||[]).forEach(p=>{if(p.fit==null)p.fit=70;if(p.inj==null)p.inj=0});
  return C}
function ecoKit(){const C=S.club,k=ECO_KITS[(C.kit==null?ecoHash(C.name):C.kit)%ECO_KITS.length];const m=typeof metaEq==='function'?metaEq('club'):null;return m&&!m.free?[m.sw,k[1]]:k}
function ecoEff(p){return p.inj>0?Math.round(p.note*.55):p.note+Math.round(((p.fit==null?70:p.fit)-70)/8)}
function ecoStr(){const c=S.club;if(!c.squad||!c.squad.length)return c.str;return Math.round(c.squad.reduce((a,p)=>a+ecoEff(p),0)/c.squad.length+(c.coach|0)*2.5+((c.morale||50)-50)/10)}
function ecoPrice(note,div){return Math.round(80*Math.pow(note/10,3.6)*Math.pow(1+div,1.6)*ecoM()*(hasP('foot')?.85:1))}
function ecoWage(p,div){return .0035*Math.pow(p.note,3)*ECO_DIVW[div]*ecoM()}
function ecoCosts(){const C=ecoC(),M=ecoM();const pl=Math.round((C.squad||[]).reduce((a,p)=>a+ecoWage(p,C.div),0)),staff=Math.round((ECO_CO[C.coach].w+ECO_MED[C.med].w)*M),up=Math.round(ECO_ST[C.stade].m*M);return{pl,staff,up,tot:pl+staff+up}}
function ecoGate(home,res){const C=ecoC(),M=ecoM(),st=ECO_ST[C.stade],T=ECO_TIX[C.tix]||ECO_TIX[1],d=C.div;
  const att=home?Math.max(0,Math.min(st.cap,Math.round(C.fans*T.d*(.75+(C.morale||50)/200)))):0;
  const g={home,att,cap:st.cap,tix:Math.round(att*ECO_TIXB[d]*T.p*M),buv:Math.round(att*(ECO_BUV[d]+.4*C.stade)*M),
    shop:Math.round((home?att:C.fans*.15)*ECO_SHOP[C.shop].k*(1+d*.15)*M),
    spons:C.spons?Math.round(C.spons.amt*(C.spons.b?(res==='W'?1.7:.45):1)):0,tv:Math.round(ECO_TV[d]*M)};
  g.tot=g.tix+g.buv+g.shop+g.spons+g.tv;return g}
function ecoReluct(o){const C=S.club;return clamp((o.note-(lvlStr(C.div)+8))/45-Math.min(.15,(C.stade|0)*.02),0,.75)}

function genOffers(){const C=ecoC(),sq=C.squad||[],avg=sq.length?sq.reduce((a,p)=>a+p.note,0)/sq.length:30;

function buyClub(nm){const c=clubCost2();if(S.cash<c){toast(`Il te manque ${fmt(c-S.cash)}.`);sfx('no');return}spend(c);

function ecoNego(i,v){const C=ecoC(),o=C.offers&&C.offers[i];if(!o)return;
  if(C.signs>=2){toast('📋 Deux signatures par mois au maximum. Reviens le mois prochain.');sfx('no');return}
  const pay=Math.round(o.price*[.8,1,1.2][v]);if(S.cash<pay){toast(`Il te manque ${fmt(pay-S.cash)}.`);sfx('no');return}
  const rel=ecoReluct(o),pr=clamp([.4,.8,.97][v]-rel,.03,.97);
  if(Math.random()<pr){spend(pay);const k=C.squad.findIndex(p=>p.poste===o.poste),old=C.squad[k],refund=Math.round(ecoPrice(old.note,C.div)*.35);earn(refund);
    C.squad[k]={poste:o.poste,name:o.name,note:o.note,fit:75,inj:0};C.offers.splice(i,1);C.signs++;C.str=ecoStr();C.morale=clamp((C.morale||50)+5,0,100);sfx('rank');
    toast(`✍️ ${o.name} signe pour ${fmt(pay)} ! ${old.name} est revendu ${fmt(refund)}.`)}
  else{if(v===0&&!o.tried){o.tried=1;o.price=Math.round(o.price*1.1);toast(`🙅 ${o.name} refuse ton offre et demande maintenant ${fmt(o.price)}.`)}
    else{C.offers.splice(i,1);toast(`🙅 ${o.name} ${rel>.25?'ne veut pas jouer en '+DIVS[C.div]:'signe dans un autre club'}.`)}sfx('no')}}
function autoScore(){const C=S.club,me=ecoStr()+(C.match.home?3:0),op=C.match.oppStr;let gf=0,ga=0;for(let t=0;t<30;t++){if(Math.random()<.045*Math.exp((me-op)/25))gf++;if(Math.random()<.045*Math.exp((op-me)/25))ga++}return [gf,ga]}
function watchMatch(){const C=S.club;if(!C.match||C.match.done)return;

function clubMonth(pm,m){
  const C=S.club;if(!C.own)return;ecoC();
  if(C.match&&!C.match.done)finishMatch(autoScore(),true);
  const k=ecoCosts(),due=Math.round(k.tot*pm);

  C.lastCosts=due;
  if(m===5&&C.played>0)endSeason();
  C.squad.forEach(p=>{if(p.inj>0)p.inj--;
    if(Math.random()<.2+C.coach*.08)p.note=clamp(p.note+1,0,99);
    p.fit=clamp(Math.round(p.fit+(70-p.fit)*.25+rand(-10,10)+((C.morale||50)-50)/12+C.med*1.5),30,100);
